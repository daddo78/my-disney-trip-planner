<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Disney Trip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="icons/site.webmanifest">
<meta name="theme-color" content="#95D6B3">
<script>try { var t = localStorage.getItem("our-disney-trip-v1:theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<meta name="apple-mobile-web-app-title" content="Disney Trip">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one phone-first column on a cream polka-dot ground (warm brown at night, the ticket stub color), a mint ticket hero with a brown stub up top, tab bar pinned to the bottom.
   Colors come from a vintage Disneyland ticket book: castle red, navy lettering, mint, brown stub, cream, orange, peach, yellow, sage. */
:root {
  --bg: #FFF1CB; --dot: #F9E4B0; --surface: #FFFCF3; --surface-2: #FDF0D3; --line: #EBD7A6;
  --ink: #0D1C2E; --muted: #6A5A42;
  --accent: #C9472D; --accent-soft: #F4D0B3; --accent-ink: #7A3E10; --on-accent: #FFFFFF;
  --hero-a: #95D6B3; --hero-b: #7FC9A2; --on-hero: #0D1C2E; --hero-pill: rgba(255, 252, 243, .55); --stub: #905318;
  --good: #24704F; --good-soft: #DDF1E4; --warn: #8A4F00; --warn-soft: #FFE5B0; --bad: #A93A21; --bad-soft: #FBDCD3;
  --c-stay: #C9472D; --c-tickets: #FF9E44; --c-travel: #905318; --c-food: #FFC754; --c-mugs: #2E7D5E; --c-fun: #A3B573; --c-other: #E9AE84;
  --shadow: 0 6px 22px rgba(13, 28, 46, .10);
  --display: "Fredoka", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #2A1C0F; --dot: #33230F; --surface: #3A2716; --surface-2: #47311C; --line: #5E4426;
  --ink: #FFF1CB; --muted: #E6C9A8;
  --accent: #FF9E44; --accent-soft: #5A3519; --accent-ink: #FFC754; --on-accent: #0D1C2E;
  --on-hero: #0D1C2E; --hero-pill: rgba(255, 252, 243, .55);
  --good: #C5D49F; --good-soft: #2F3A1E; --warn: #FFC754; --warn-soft: #4A3410; --bad: #FF9A7A; --bad-soft: #4E2216;
  --c-stay: #E8674A; --c-travel: #C98A4A; --c-mugs: #5FBF95;
  --shadow: 0 6px 22px rgba(0, 0, 0, .35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #2A1C0F; --dot: #33230F; --surface: #3A2716; --surface-2: #47311C; --line: #5E4426;
  --ink: #FFF1CB; --muted: #E6C9A8;
  --accent: #FF9E44; --accent-soft: #5A3519; --accent-ink: #FFC754; --on-accent: #0D1C2E;
  --on-hero: #0D1C2E; --hero-pill: rgba(255, 252, 243, .55);
  --good: #C5D49F; --good-soft: #2F3A1E; --warn: #FFC754; --warn-soft: #4A3410; --bad: #FF9A7A; --bad-soft: #4E2216;
  --c-stay: #E8674A; --c-travel: #C98A4A; --c-mugs: #5FBF95;
  --shadow: 0 6px 22px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; font-family: var(--body); font-size: 16px; line-height: 1.45; color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 18%, transparent 20%), radial-gradient(var(--dot) 18%, transparent 20%);
  background-size: 34px 34px; background-position: 0 0, 17px 17px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.15; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; }
.num { font-variant-numeric: tabular-nums; }
main { max-width: 760px; margin: 0 auto; padding-block: 18px calc(110px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }

/* brand */
.brand { display: flex; align-items: center; gap: 10px; }
.logo { height: 34px; width: auto; flex: none; }
.brand b { font-family: var(--display); font-weight: 600; font-size: 1.1rem; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.top-right { display: flex; align-items: center; gap: 10px; }
.theme-btn { border: 2px solid var(--line); background: var(--surface); color: var(--ink); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.sync { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.sync.local::before { background: var(--warn); }

/* cards */
.card { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.soft { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: var(--muted); }

/* hero ticket */
.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 22px 22px 20px; color: var(--on-hero);
  background: linear-gradient(140deg, var(--hero-a), var(--hero-b)); box-shadow: var(--shadow); border-left: 16px solid var(--stub); }
.hero .eyebrow { color: var(--on-hero); opacity: .85; }
.hero h1 { font-size: clamp(1.7rem, 6vw, 2.3rem); margin-top: 4px; display: inline-block; padding-bottom: 4px; border-bottom: 3px solid var(--accent); }
.count { display: flex; align-items: baseline; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.count strong { font-family: var(--display); font-size: clamp(3.4rem, 15vw, 5rem); font-weight: 700; line-height: .9; }
.count span { font-family: var(--display); font-size: 1.2rem; }
.hero .meta { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.hero .pill { background: var(--hero-pill); color: var(--on-hero); border: 0; }
/* z-index: the faded eyebrow line forms its own layer and would otherwise sit on top of the button's middle. */
.hero .edit { position: absolute; top: 12px; right: 12px; z-index: 2; width: 46px; height: 46px; background: var(--hero-pill); border: 2px solid rgba(13, 28, 46, .15); }
.sparkle { position: absolute; pointer-events: none; color: var(--on-hero); opacity: .5; }
.perf { position: absolute; left: 0; right: 0; bottom: 0; height: 10px;
  background: radial-gradient(circle at 8px 10px, var(--bg) 6px, transparent 6.5px) 0 0 / 16px 10px repeat-x; }

/* pills & buttons */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700;
  background: var(--accent-soft); color: var(--accent-ink); border: 0; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.plain { background: var(--surface-2); color: var(--muted); }
.btn { border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 800; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; gap: 6px; }
.btn.ghost { background: var(--accent-soft); color: var(--accent-ink); }
.btn.quiet { background: transparent; color: var(--muted); padding: 8px 10px; }
.btn.sm { padding: 6px 12px; font-size: .875rem; }
.btn:hover { filter: brightness(1.05); }
.icon-btn { border: 0; background: rgba(255,255,255,.2); color: inherit; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; }
.card .icon-btn { background: var(--surface-2); color: var(--muted); }
.heart { border: 0; background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 6px 12px; font-weight: 800; display: inline-flex; gap: 6px; align-items: center; }
.heart.on { background: var(--accent-soft); color: var(--accent); }
.heart svg { width: 18px; height: 18px; }
.heart.pop svg { animation: pop .35s ease; }
@keyframes pop { 50% { transform: scale(1.35); } }

/* budget meter */
.meter { position: relative; height: 22px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: flex; }
.meter span { height: 100%; }
.meter .limit { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--ink); border-radius: 2px; }
.big3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.big3 div { min-width: 0; }
.big3 strong { display: block; font-family: var(--display); font-size: clamp(1.25rem, 5vw, 1.7rem); font-weight: 600; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }

/* resorts */
.toolbar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chip { border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-weight: 700; white-space: nowrap; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.resort { display: grid; gap: 12px; }
.resort.picked { outline: 3px solid var(--accent); }
.resort .head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.resort .head > div { min-width: 0; }
.price { text-align: right; flex: none; }
.price strong { font-family: var(--display); font-size: 1.6rem; font-weight: 600; display: block; line-height: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.costbar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.costbar span { display: block; height: 100%; border-radius: 999px; }
.costbar.sm { height: 6px; }
.stay-meter { display: grid; gap: 4px; }
.note { white-space: pre-wrap; font-size: .95rem; }
.quote { border-left: 4px solid var(--accent-soft); padding-left: 10px; }
.picked-badge { background: var(--accent); color: var(--on-accent); }
.insight { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.insight .ic { width: 42px; height: 42px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
details summary { cursor: pointer; font-weight: 800; color: var(--muted); }

/* lists */
.list { display: grid; gap: 2px; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px dashed var(--line); }
.item:last-child { border-bottom: 0; }
.item > div { min-width: 0; }
.item .t { font-weight: 700; overflow-wrap: anywhere; }
.item.done .t { text-decoration: line-through; color: var(--muted); }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.check { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--accent); background: transparent; display: grid; place-items: center; color: var(--on-accent); padding: 0; }
.check.on { background: var(--accent); }
.check svg { width: 16px; height: 16px; }
.amount { font-family: var(--display); font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; text-align: right; }
.park { display: grid; gap: 6px; }
.park h3 { display: flex; align-items: center; gap: 8px; }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  box-shadow: 0 -4px 18px rgba(13, 28, 46, .08); }
.tabs nav { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; }
.tabs button { border: 0; background: transparent; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 6px 0; border-radius: 14px; font-size: .64rem; font-weight: 800; white-space: nowrap; min-width: 0; }
.news { display: grid; gap: 6px; }
.news a.t { color: var(--ink); text-decoration: none; font-family: var(--display); font-weight: 600; font-size: 1.08rem; line-height: 1.25; }
.news a.t:hover { color: var(--accent); }
.tabs button .art { width: 28px; height: 28px; object-fit: contain; opacity: .6; filter: saturate(.5); transition: opacity .15s, transform .15s; }
.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.tabs button[aria-current="page"] .art { opacity: 1; filter: none; transform: scale(1.08); }
.park h3 .art, .insight .art { object-fit: contain; flex: none; }
.tabs button .dots { width: 28px; height: 28px; display: grid; place-items: center; opacity: .75; }
.tabs button.more-on { color: var(--accent); background: var(--accent-soft); }

/* "More" pop-up (the tabs that don't fit in the bar) and its reorder list, the way Teams does it */
.moregrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.moregrid button { border: 0; background: var(--surface-2); border-radius: 16px; padding: 12px 4px 10px; display: grid; justify-items: center; gap: 6px; font-weight: 800; font-size: .8rem; color: var(--ink); min-width: 0; }
.moregrid button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.moregrid .art { width: 44px; height: 44px; object-fit: contain; }
.navlist { display: grid; }
.navlist .nav-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 8px 2px; border-bottom: 1px dashed var(--line); font-weight: 800; font-size: 1.05rem; }
.navlist .art { width: 34px; height: 34px; object-fit: contain; }
.navlist .nav-sep { font-family: var(--display); font-weight: 600; font-size: 1.15rem; padding: 14px 2px 4px; }
.navlist .moves { display: flex; gap: 6px; }
.navlist .moves .icon-btn { background: var(--surface-2); color: var(--muted); width: 34px; height: 34px; }
.navlist .moves .icon-btn:disabled { opacity: .3; }

/* plan: one card per day */
.day { scroll-margin-top: 16px; }
.day-row { background: var(--surface); transition: transform .18s ease; }
.day-row .eyebrow { display: block; font-size: .68rem; }
.day-row .handle { color: var(--muted); padding: 8px 4px 8px 12px; touch-action: none; cursor: grab; line-height: 0; }
.day-row.lifted { position: relative; z-index: 3; transition: none; box-shadow: var(--shadow); border-radius: 12px; outline: 2px solid var(--accent); }
.day h3 { margin: 0; display: block; }
.day h3 .when { display: block; font-family: var(--body); font-size: .8rem; font-weight: 700; color: var(--muted); }
.day .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.day .head button.who { border: 0; background: transparent; padding: 0; text-align: left; display: flex; align-items: center; gap: 10px; min-width: 0; color: inherit; }
.day.rest { background: var(--surface-2); }
.sched { display: grid; }
.sched .slot { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; align-items: center; padding: 8px 2px; border-bottom: 1px dashed var(--line); }
.sched .slot:last-child { border-bottom: 0; }
.sched .slot > div { min-width: 0; }
.sched .tm { font-family: var(--display); font-weight: 600; font-size: .9rem; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.sched .t { font-weight: 700; overflow-wrap: anywhere; }
.kind { font-size: .7rem; padding: 2px 8px; }
.kind.ride { background: var(--accent-soft); color: var(--accent-ink); }
.kind.food { background: var(--warn-soft); color: var(--warn); }
.kind.show { background: var(--good-soft); color: var(--good); }
.daystrip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.daystrip button { flex: none; display: grid; justify-items: center; gap: 2px; width: 50px; padding: 6px 0; border-radius: 14px; background: var(--surface); border: 2px solid var(--line); color: var(--ink); text-decoration: none; font-weight: 800; font-size: .72rem; }
.daystrip button .art { width: 26px; height: 26px; object-fit: contain; }
.daystrip button.rest { background: var(--surface-2); }

/* scores, stars & compare */
.score { flex: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; align-content: center; background: var(--tone-soft); color: var(--tone);
  font-family: var(--display); font-weight: 600; font-size: 1.35rem; line-height: 1; border: 3px solid var(--tone); }
button.score { cursor: pointer; padding: 0; font-family: var(--display); font-weight: 600; }
/* Pop-ups with a pinned header: the sheet's top padding moves into the header so it covers what scrolls under it. */
.sheet.pinned { padding-top: 0; }
.sheet-top { position: sticky; top: 0; z-index: 2; background: var(--surface); display: grid; gap: 12px; padding: 20px 0 10px; margin-bottom: -4px; border-bottom: 1px solid transparent; transition: border-color .15s; }
.sheet-top.scrolled { border-bottom-color: var(--line); }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sheet-head > div { min-width: 0; }
.sheet-head .icon-btn { flex: none; }
.cal { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; flex: none; }
.score small { font-family: var(--body); font-size: .55rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.score.none { --tone: var(--line); --tone-soft: var(--surface-2); color: var(--muted); font-size: .7rem; text-align: center; }
.resort .head .who { display: flex; gap: 12px; align-items: center; min-width: 0; }
.stars { display: inline-flex; gap: 0; }
.stars button { border: 0; background: transparent; padding: 4px; color: var(--line); line-height: 0; }
.stars button svg { width: 26px; height: 26px; }
.stars button.on { color: var(--c-food); }
.stars button.on path { stroke: var(--warn); }
.stars.sm button { padding: 1px; } .stars.sm button svg { width: 16px; height: 16px; }
.receipt { display: grid; gap: 2px; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; border: 2px dashed var(--line); font-size: .9rem; }
.receipt > div { display: flex; justify-content: space-between; gap: 10px; }
.receipt b { font-variant-numeric: tabular-nums; flex: none; }
.receipt .plus { color: var(--good); } .receipt .minus { color: var(--bad); }
.receipt .total { border-top: 2px dashed var(--line); margin-top: 4px; padding-top: 6px; font-family: var(--display); font-size: 1.05rem; font-weight: 600; }
.rank { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 2px solid var(--line);
  background: var(--surface); border-radius: 14px; padding: 8px 10px; }
.rank[aria-pressed="true"] { border-color: var(--opt, var(--accent)); background: var(--surface-2); }
.rank .n { font-family: var(--display); font-weight: 600; color: var(--muted); text-align: center; }
.rank .score { width: 40px; height: 40px; font-size: 1rem; border-width: 2px; }
.cmprow { display: grid; gap: 6px; }
.wxicons { display: inline-flex; gap: 6px; align-items: center; }
.wxic { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; flex: none; }
.wxic svg { width: 20px; height: 20px; }
.wxic.hot { background: var(--bad-soft); color: var(--bad); }
.wxic.rain { background: var(--good-soft); color: var(--c-mugs); }
.wxic.hurricane { background: var(--warn-soft); color: var(--warn); }
.optcell .wxicons { gap: 3px; flex-wrap: wrap; }
.optcell .wxic { width: 25px; height: 25px; } .optcell .wxic svg { width: 16px; height: 16px; }
.wxkey { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.wxkey .wxic { width: 22px; height: 22px; } .wxkey .wxic svg { width: 15px; height: 15px; }
.optcell .pill { justify-self: start; white-space: normal; max-width: 100%; margin-bottom: 3px; }
.optcell .best { color: var(--good); font-weight: 800; font-size: .72rem; }
.opt-tag { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--opt); color: var(--surface); font-family: var(--display); font-weight: 600; }
.opt-tag.sm { width: 22px; height: 22px; font-size: .8rem; }
.optgrid { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 8px; }
.optcell { background: var(--surface-2); border-radius: 14px; padding: 10px; display: grid; gap: 2px; align-content: start; border-top: 4px solid var(--opt); min-width: 0; }
.optcell strong { font-family: var(--display); font-size: 1.25rem; font-weight: 600; }
.optcell .btn { justify-self: start; padding: 4px 0; font-size: .78rem; }

  // ---------- derived ----------

  function seasonsFor(a, b) {

  // Amenities and perks are free-form tags. Older options get theirs from the room fields they were saved with.

  function amenitiesOf(r) {

    add(DESIRE[stars], stars * PTS.star);
    if (n > 0) add(`${n} night${n === 1 ? "" : "s"}`, Math.min(n, PTS.maxNights) * PTS.night);
    if (total > 0) {
      const d = room - total;
      if (d >= 0) add(`${money(d)} under budget`, Math.min(PTS.maxUnder, Math.floor(d / 100) * PTS.under));

  const scoreTone = (n) => (n == null ? "" : n >= 90 ? "good" : n >= 60 ? "warn" : "bad");
  // With an option id, the badge is a button that opens that option's receipt in a pop-up.

        <div class="row between"><span class="eyebrow">Our pick</span><button class="btn quiet sm" data-act="tab" data-k="dates">Compare all</button></div>
        <div class="row between"><div><h3>${esc(pick.name)}</h3><div class="muted small">${esc(pick.room)} · ${nights(pick.start, pick.end)} nights</div></div>
        <div class="price"><strong class="num">${money(pick.total)}</strong><span class="muted small">${money(pick.total / (nights(pick.start, pick.end) || 1))}/night</span></div></div>
        ${pick.notes ? `<div class="note quote muted">${esc(pick.notes.split("\n")[0])}</div>` : ""}</div>`
      : `<div class="card insight">${art("resort", 48)}<div class="stack" style="gap:6px"><h3>No resort picked yet</h3>
        <div class="muted small">Add options on the Resorts tab, line them up on Compare, and tap “Make it our pick.” Its price fills in the stay line of the budget.</div>
        <div><button class="btn sm" data-act="tab" data-k="dates">Compare options</button></div></div></div>`;
    const top = rankedOptions().filter((r) => r.sc.overall != null).slice(0, 3);
    const todos = entries("todos").filter((x) => !x.done).map((x) => ({ ...x, d: dueDate(x) })).filter((x) => x.d && x.d >= today()).sort((a, b) => a.d - b.d).slice(0, 3);
    const wish = entries("wishes"), food = entries("food");
    const wx = weatherFor(s.start, s.end), who = party();
    return `
      <section class="hero">
        <svg class="sparkle" style="right:18%;top:22px" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>
        <svg class="sparkle" style="right:8%;top:70px" width="12" height="12" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>
        ${canWrite ? `<button class="icon-btn edit" data-act="edit-trip" aria-label="Edit trip details">${I.pencil}</button>` : ""}
        <div class="eyebrow">Walt Disney World · ${start ? start.getFullYear() : ""}</div>
        <h1>${esc(tripDoc().name)}</h1>
        <div class="count">${count}</div>
        ${who.people.length ? `<div class="who">${esc(nameList(who.people))}</div>` : ""}
        <div class="meta"><span class="pill">${esc(span(s.start, s.end))}</span><span class="pill">${n} nights</span>${canWrite ? `<button class="pill" data-act="edit-trip" aria-label="Edit trip and who's going">` : `<span class="pill">`}${who.count} going${canWrite ? "</button>" : "</span>"}${wx && wx.known.length ? `<span class="pill">${I.sun} Usually ${wx.hiMax}° / ${wx.loMin}°</span>` : ""}</div>
        <div class="perf"></div>
      </section>
      <section class="card stack">
        <div class="row between"><h2>Budget</h2><button class="btn quiet sm" data-act="tab" data-k="budget">Details</button></div>
        ${leftHTML(t)}${meterHTML(t)}
      </section>
      ${pickHTML}
      ${top.length ? `<section class="card stack"><div class="row between"><span class="eyebrow">Top options</span><button class="btn quiet sm" data-act="tab" data-k="dates">Compare</button></div>
        ${top.map((r) => `<div class="row between"><div><b>${esc(r.name)}</b><div class="muted small">${CAL}${esc(span(r.start, r.end))} · ${money(r.total)}</div></div><span class="pill ${scoreTone(r.sc.overall)}">${r.sc.overall} pts</span></div>`).join("")}</section>`
        : `<section class="card insight">${art("gold-star", 48)}<div class="row between"><div><b>Which option wins?</b><div class="muted small">Add resorts with dates and prices, rate them, and each one gets an overall score.</div></div><button class="btn sm" data-act="tab" data-k="resorts">Resorts</button></div></section>`}
      ${weatherCard(s.start, s.end, true)}
      <section class="card stack">
        <div class="row between"><h2>Coming up</h2><button class="btn quiet sm" data-act="tab" data-k="todo">All to-dos</button></div>
        ${todos.length ? todos.map((x) => { const r = relDays(x.d); return `<div class="row between"><div><b>${esc(x.text)}</b><div class="muted small">${fmt(x.d, { month: "long", day: "numeric", year: "numeric" })}</div></div><span class="pill ${r.cls}">${r.text}</span></div>`; }).join("") : `<div class="muted">Nothing dated coming up.</div>`}
      </section>
      ${newsCard()}
      <section class="card row between"><div><span class="eyebrow">Dream list</span><div><b class="num">${wish.filter((w) => w.done).length}</b> of <b class="num">${wish.length}</b> done</div></div><button class="btn ghost sm" data-act="tab" data-k="dreams">${art("sorcerer-hat", 20)} Open</button></section>
      <section class="card row between"><div><span class="eyebrow">Food plan</span><div><b class="num">${food.filter((f) => f.done).length}</b> of <b class="num">${food.length}</b> eaten</div></div><button class="btn ghost sm" data-act="tab" data-k="food">${art("pretzel", 20)} Open</button></section>`;
  }

  // Each resort doc is one scenario: a resort, dates, and the price she found. Weather, seasons and the score come from the dates.
  function resortsView() {
    const t = totals(), s = settings();
    let list = rankedOptions();
    const out = entries("resorts").filter((r) => r.out);
    const f = view.filter;
    // Besides "Our dates", the filter chips are the perks most options share.
    const perkCount = {};
    list.forEach((r) => perksOf(r).forEach((p) => (perkCount[p] = (perkCount[p] || 0) + 1)));
    const perkChips = Object.keys(perkCount).filter((p) => perkCount[p] < list.length || list.length === 1).sort((a, b) => perkCount[b] - perkCount[a]).slice(0, 3);
    if (f.startsWith("perk:")) list = list.filter((r) => perksOf(r).includes(f.slice(5)));
    if (f === "dates") list = list.filter((r) => r.start === s.start && r.end === s.end);
    const per = (r) => (Number(r.total) || 0) / (nights(r.start, r.end) || 1);
    if (view.sort === "price") list.sort((a, b) => (Number(a.total) || 0) - (Number(b.total) || 0));
    if (view.sort === "night") list.sort((a, b) => per(a) - per(b));
    if (view.sort === "desire") list.sort((a, b) => (Number(b.desire) || 0) - (Number(a.desire) || 0) || (b.sc.overall ?? -1) - (a.sc.overall ?? -1));

    const best = rankedOptions()[0];
    const insight = best && best.sc.overall != null ? `<section class="card insight">${art("gold-star", 48)}<div class="row between"><div><b>Most points: ${esc(best.name)}</b>
      <div class="muted small">${esc(span(best.start, best.end))}, ${money(best.total)}, ${best.sc.overall} points.</div></div><button class="btn sm" data-act="tab" data-k="dates">Compare</button></div></section>` : "";

    const chip = (k, label) => `<button class="chip" data-act="filter" data-k="${esc(k)}" aria-pressed="${view.filter === k}">${esc(label)}</button>`;
    const sortSel = `<label class="row small muted" for="sort">Sort <select id="sort" data-act="sort" class="chip" style="padding:4px 10px">
      ${[["score", "Most points"], ["price", "Total price"], ["night", "Per night"], ["desire", "Most wanted"]].map(([v, l]) => `<option value="${v}" ${view.sort === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>`;

    const cards = list.map((r) => {
      const n = nights(r.start, r.end), picked = s.pickId === r.id, sc = r.sc;
      const diffDates = r.start !== s.start || r.end !== s.end;
      return `<article class="card resort ${picked ? "picked" : ""}">
        <div class="head"><div class="who">${scoreBadge(sc.overall, r.id)}<div style="min-width:0">
          ${picked ? `<span class="pill picked-badge">Our pick</span> ` : ""}<h3 style="display:inline">${esc(r.name)}</h3>
          <div class="muted small">${esc(r.room)}${r.vibe ? " · " + esc(r.vibe) : ""}</div></div></div>
          <div class="price"><strong class="num">${Number(r.total) ? money(r.total) : "–"}</strong><span class="muted small num">${Number(r.total) ? money(per(r)) + "/night" : "Add a price"}</span></div></div>
        <div class="row between"><span class="pill ${diffDates ? "warn" : "plain"}">${CAL}${esc(span(r.start, r.end))} · ${n} nights</span>${seasonIcons(r.start, r.end)}</div>
        ${wxLine(sc.wx)}
        <div class="row between"><span class="small" style="font-weight:800">${esc(DESIRE[Number(r.desire) || 0])}</span>${starsHTML(r)}</div>
        ${Number(r.total) ? stayMeter(Number(r.total), t.room) : ""}
        ${perksOf(r).length ? `<div class="stack" style="gap:6px"><span class="eyebrow">Perks</span><div class="tags">${tagPills(perksOf(r), "good")}</div></div>` : ""}
        ${amenitiesOf(r).length ? `<div class="stack" style="gap:6px"><span class="eyebrow">Amenities</span><div class="tags">${tagPills(amenitiesOf(r), "plain")}</div></div>` : ""}
        ${r.notes ? `<div class="note quote">${esc(r.notes)}</div>` : ""}
        ${prosConsHTML(r.name)}
        ${Number(r.total) ? `<div class="soft small">Against the ${money(t.room)} for a resort, this ${sc.left >= 0 ? `leaves <b style="color:var(--good)">${money(sc.left)}</b> to spare` : `goes <b style="color:var(--bad)">${money(-sc.left)} over</b>`}.</div>` : ""}
        ${canWrite ? `<div class="row between">
          <button class="icon-btn" data-act="edit-resort" data-id="${r.id}" aria-label="Edit ${esc(r.name)}">${I.pencil}</button>
          ${picked ? `<button class="btn ghost sm" data-act="unpick">Unpick</button>` : `<button class="btn sm" data-act="pick" data-id="${r.id}">Make it our pick</button>`}
        </div>` : ""}</article>`;
    }).join("");

    const empty = !entries("resorts").length
      ? `<div class="card empty"><h3>No options yet</h3><div>Add a resort with the dates and the total price you found.</div>${canWrite ? `<button class="btn" data-act="add-resort">${I.plus} Add an option</button>` : ""}</div>`
      : !list.length ? `<div class="card empty">Nothing matches this filter.</div>` : "";

    return `<div class="row between"><h2>Resorts</h2>${canWrite ? `<button class="btn sm" data-act="add-resort">${I.plus} Add option</button>` : ""}</div>
      <div class="muted">Each card is one option: a resort, your dates and the price you found. Weather and seasons fill in from the dates. Rate how much you want it, and the points add up.</div>
      ${insight}
      <div class="toolbar" role="group" aria-label="Filter options">${chip("all", "All")}${chip("dates", "Our dates")}${perkChips.map((p) => chip("perk:" + p, p)).join("")}</div>
      <div class="row between"><span class="muted small">${list.length} option${list.length === 1 ? "" : "s"} for ${party().count} people</span>${sortSel}</div>
      ${cards}${empty}
      <div class="src">Prices: what we found when we looked. ${scoreHow()}</div>
      ${out.length ? `<details class="card"><summary>Ruled out (${out.length})</summary><div class="stack" style="margin-top:12px">${out.map((r) => `<div class="row between"><div><b>${esc(r.name)}</b> <span class="muted small">${esc(span(r.start, r.end))}${Number(r.total) ? " · " + money(r.total) : ""}</span><div class="muted small note">${esc(r.notes)}</div></div>${canWrite ? `<button class="icon-btn" data-act="edit-resort" data-id="${r.id}" aria-label="Edit ${esc(r.name)}">${I.pencil}</button>` : ""}</div>`).join("")}</div></details>` : ""}`;
  }

  // How the score and seasons are worked out, with sources. Shown under both tabs.
  function scoreHow() {
    const w = weather();
    return `Points: +${PTS.star} per star, +${PTS.night} per night (up to ${PTS.maxNights}), +${PTS.under} per $100 under the resort budget (up to +${PTS.maxUnder}) or −${PTS.over} per $100 over, −${PTS.perDegree} per degree the usual high averages above ${PTS.hotFrom}°, +${PTS.perk} per perk (up to ${PTS.maxPerks}), +${PTS.amenity} per amenity (up to ${PTS.maxAmenities}), and +1 per pro, −1 per con (up to ±${PTS.maxProsCons}). The resort budget is the resort line on the Budget tab, or what the other lines leave.
      Icons: ${ICON_KEY}.
      Weather: ${link(w.url, w.source)}, ${esc(w.years)} averages, not a forecast. Rainy season: ${link(SEASONS.rainy.url, SEASONS.rainy.source)}. Hurricane season: ${link(SEASONS.hurricane.url, SEASONS.hurricane.source)}.`;
  }

  // Up to three options side by side, picked from the ranking. Saved in trip/compare so we both see the same ones.
  const OPT = [{ k: "A", color: "var(--accent)" }, { k: "B", color: "var(--c-travel)" }, { k: "C", color: "var(--c-mugs)" }];
  function cmpIds(ranked) {
    const saved = (state.trip.compare && state.trip.compare.ids) || view.cmpIds;
    const ids = (saved || []).filter((id) => ranked.some((r) => r.id === id));
    return saved ? ids : ranked.slice(0, 3).map((r) => r.id);
  }
  function setCmpIds(ids) {
    view.cmpIds = ids;
    if (canWrite) put("trip", "compare", { ids }); else render();
  }

  function datesView() {
    const t = totals(), s = settings();
    const ranked = rankedOptions(), ids = cmpIds(ranked);
    if (!ranked.length) return `<h2>Compare</h2><div class="card empty"><h3>Nothing to compare yet</h3><div>Add resort options with dates and prices on the Resorts tab.</div><button class="btn" data-act="tab" data-k="resorts">Go to Resorts</button></div>`;
    const cols = ids.map((id, i) => ({ ...ranked.find((r) => r.id === id), ...OPT[i] }));

    const rankList = `<section class="card stack"><div class="row between"><h3>Ranking</h3><span class="muted small">Tap up to 3 to compare</span></div>
      ${ranked.map((r, i) => { const j = ids.indexOf(r.id); return `<button type="button" class="rank" data-act="cmp-toggle" data-id="${esc(r.id)}" aria-pressed="${j >= 0}" ${j >= 0 ? `style="--opt:${OPT[j].color}"` : ""}>
        <span class="n">${j >= 0 ? `<b class="opt-tag sm">${OPT[j].k}</b>` : i + 1}</span>
        <span style="min-width:0"><b>${esc(r.name)}</b><span class="muted small" style="display:block">${CAL}${esc(span(r.start, r.end))} · ${Number(r.total) ? money(r.total) : "no price"}</span></span>
        ${scoreBadge(r.sc.overall)}</button>`; }).join("")}</section>`;

    // One row per thing to compare. best: "high" or "low" marks the winner when there's more than one option.
    const perNight = (r) => (Number(r.total) || 0) / (nights(r.start, r.end) || 1);
    const rows = [
      ["Points", (r) => r.sc.overall, "high", (r) => scoreBadge(r.sc.overall, r.id)],
      ["Total price", (r) => Number(r.total) || null, "low", (r) => `<strong class="num">${Number(r.total) ? money(r.total) : "–"}</strong>`],
      ["Per night", (r) => (Number(r.total) ? perNight(r) : null), "low", (r) => `<span class="num">${Number(r.total) ? money(perNight(r)) : "–"}</span>`],
      ["Budget", (r) => (Number(r.total) ? r.sc.left : null), "high", (r) => Number(r.total) ? `<span class="small" style="font-weight:800;color:var(--${r.sc.left >= 0 ? "good" : "bad"})">${r.sc.left >= 0 ? `${money(r.sc.left)} under` : `${money(-r.sc.left)} over`}</span>${stayMeter(Number(r.total), t.room, true)}` : "–"],
      ["How much we want it", (r) => Number(r.desire) || null, "high", (r) => `${starsHTML(r, true)}<span class="small">${esc(DESIRE[Number(r.desire) || 0])}</span>`],
      ["Dates", null, null, (r) => `<span class="small" style="font-weight:800">${CAL}${esc(span(r.start, r.end))}</span><span class="muted small">${nights(r.start, r.end)} nights</span>`],
      ["Usual highs", (r) => (r.sc.wx && r.sc.wx.known.length ? r.sc.wx.hiAvg : null), "low", (r) => r.sc.wx && r.sc.wx.known.length ? `<strong class="num">${r.sc.wx.hiMin === r.sc.wx.hiMax ? r.sc.wx.hiMax : `${r.sc.wx.hiMin}–${r.sc.wx.hiMax}`}°</strong><span class="muted small">lows ${r.sc.wx.loMin}–${r.sc.wx.loMax}°</span>` : "–"],
      ["Rain", (r) => (r.sc.wx && r.sc.wx.known.length ? r.sc.wx.rainAvg : null), "low", (r) => r.sc.wx && r.sc.wx.known.length ? `<strong class="num">${r.sc.wx.rainAvg}%</strong><span class="muted small">~${Math.round(r.sc.wx.rainDays)} rainy days</span>` : "–"],
      ["Heads up", null, null, (r) => seasonIcons(r.start, r.end) || `<span class="muted small">None</span>`],
      ["Room", null, null, (r) => `<span class="small" style="font-weight:800">${esc(r.room || "")}</span>`],
      ["Perks", null, null, (r) => tagPills(perksOf(r), "good") || `<span class="muted small">None yet</span>`],
      ["Amenities", null, null, (r) => tagPills(amenitiesOf(r), "plain") || `<span class="muted small">None yet</span>`],
      ["Pros & cons", null, null, (r) => pcCount(r.name) || `<span class="muted small">None yet</span>`],
    ];
    const grid = cols.length ? rows.map(([label, val, dir, cell]) => {
      const vals = val ? cols.map(val) : [], known = vals.filter((v) => v != null);
      const win = dir && cols.length > 1 && known.length > 1 && new Set(known).size > 1 ? (dir === "high" ? Math.max(...known) : Math.min(...known)) : null;
      return `<div class="cmprow"><div class="eyebrow">${esc(label)}</div><div class="optgrid" style="--cols:${cols.length}">${cols.map((r, i) => `<div class="optcell" style="--opt:${r.color}">
        ${cell(r)}${win != null && vals[i] === win ? `<span class="best">★ Best</span>` : ""}</div>`).join("")}</div></div>`;
    }).join("") : "";
    const heads = `<div class="optgrid" style="--cols:${cols.length}">${cols.map((r) => `<div class="optcell" style="--opt:${r.color}">
      <div class="row between"><b class="opt-tag sm">${r.k}</b>${canWrite ? `<button class="x" data-act="cmp-toggle" data-id="${esc(r.id)}" aria-label="Take ${esc(r.name)} out of the comparison">×</button>` : ""}</div>
      <b>${esc(r.name)}</b><span class="muted small">${esc(r.room)}</span>
      ${s.pickId === r.id ? `<span class="pill picked-badge">Our pick</span>` : canWrite ? `<button class="btn quiet sm" data-act="pick" data-id="${esc(r.id)}">Make it our pick</button>` : ""}</div>`).join("")}</div>`;

    return `<h2>Compare</h2>
      <div class="muted">Your options from the Resorts tab, most points first. Pick up to three to line up side by side.</div>
      ${rankList}
      ${cols.length ? `<section class="card stack">${heads}${grid}</section>` : `<div class="card empty">Tap options in the ranking to compare them.</div>`}
      <div class="src">${scoreHow()}</div>`;
  }

  // How much of the money left for a resort (budget minus every other cost) a stay uses.
  // Green up to 80%, orange up to 100%, red once it goes over the budget.
  function stayMeter(total, room, compact) {
    const share = room > 0 ? total / room : Infinity;
    const tone = share <= 0.8 ? "good" : share <= 1 ? "warn" : "bad";
    const bar = `<div class="costbar${compact ? " sm" : ""}" role="img" aria-label="Uses ${isFinite(share) ? Math.round(share * 100) + "%" : "all"} of the money left for the stay"><span style="width:${Math.min(1, isFinite(share) ? share : 1) * 100}%;background:var(--${tone})"></span></div>`;
    if (compact) return bar;
    return `<div class="stay-meter"><div class="row between small"><span class="muted">Share of the ${money(Math.max(0, room))} for a resort</span><b style="color:var(--${tone})">${isFinite(share) ? Math.round(share * 100) + "%" : "Over"}</b></div>${bar}</div>`;
  }

  // One row per budget item she adds (budget/<id>), sorted by category. Amounts edit in place; the pencil renames, moves or deletes.
  // With no resort item, a stand-in resort row uses our pick's price (typing an amount there saves it as budget/stay).
  const catOf = (i) => (CATS[i.cat] ? i.cat : "other");
  function budgetView() {
    const t = totals(), order = Object.keys(CATS);
    const items = [...t.items].sort((a, b) => order.indexOf(catOf(a)) - order.indexOf(catOf(b)));
    const hasStay = items.some((i) => catOf(i) === "stay");
    const staySub = (amt) => {
      if (!t.pick) return `No resort picked yet. <button class="btn quiet sm" data-act="tab" data-k="dates" style="padding:0">Compare options</button>`;
      if (!hasStay) return `Using our pick, ${esc(t.pick.name)}`;
      const d = amt - (Number(t.pick.total) || 0);
      return `Our pick, ${esc(t.pick.name)}, is ${money(t.pick.total)} (${d >= 0 ? `${money(d)} under` : `<b style="color:var(--bad)">${money(-d)} over</b>`})`;
    };
    // Tapping the name opens the item to rename, move or delete it (no separate pencil, so names have room on a phone).
    const row = (id, c, label, amt, sub, ph) => {
      const name = canWrite && id !== "new-stay" ? `<button class="bname" data-act="edit-budget" data-id="${id}"><span class="t">${esc(label)}</span>${I.pencil}</button>` : `<div class="t">${esc(label)}</div>`;
      return `<div class="item"><span class="dot" style="background:${CATS[c].color}"></span>
        <div>${name}${sub ? `<div class="muted small">${sub}</div>` : ""}</div>
        <label class="amt">$<input type="number" inputmode="numeric" min="0" step="50" data-item="${id}" value="${amt == null ? "" : esc(String(Math.round(Number(amt) || 0)))}" placeholder="${esc(ph || "0")}" aria-label="${esc(label)} amount" ${canWrite ? "" : "disabled"}></label></div>`;
    };
    const rows = (hasStay ? "" : row("new-stay", "stay", CATS.stay.label, null, staySub(0), t.pick ? String(Math.round(Number(t.pick.total) || 0)) : "0"))
      + items.map((i) => {
        const c = catOf(i), label = i.label || CATS[c].label;
        const bits = [label !== CATS[c].label ? esc(CATS[c].label) : "", i.status === "Estimate" ? `<span class="pill warn kind">Estimate</span>` : "", c === "stay" ? staySub(Number(i.amount) || 0) : "", i.note ? esc(i.note) : ""].filter(Boolean);
        return row(i.id, c, label, i.amount ?? 0, bits.join(" · "));
      }).join("");
    return `<div class="row between"><h2>Budget</h2>${canWrite ? `<button class="btn sm" data-act="add-budget">${I.plus} Add an item</button>` : ""}</div>
      <div class="muted">Add what we'll spend on, from park tickets to a Universal day. Change an amount right in the list; tap a name to rename, move or delete it.</div>
      <section class="card stack">${leftHTML(t)}${meterHTML(t)}
        ${t.left < 0 ? `<div class="soft small">The categories add up to <b style="color:var(--bad)">${money(-t.left)}</b> more than the budget.</div>` : `<div class="soft small">Not set aside for anything yet: <b style="color:var(--good)">${money(t.left)}</b>.</div>`}
        ${canWrite ? `<div><button class="btn ghost sm" data-act="edit-trip">Change total budget</button></div>` : ""}</section>
      <section class="card"><div class="list">${rows}</div></section>

  }
  // An amount typed in the list. Clearing the only resort item goes back to using our pick's price.
  function setItemAmount(id, raw) {
    if (id === "new-stay") { if (raw !== "") put("budget", "stay", { label: CATS.stay.label, cat: "stay", amount: Math.max(0, Math.round(Number(raw) || 0)) }); return; }
    const cur = state.budget[id]; if (!cur) return;
    if (raw === "" && catOf(cur) === "stay" && entries("budget").filter((i) => catOf(i) === "stay").length === 1) { remove("budget", id); return; }
    const amount = Math.max(0, Math.round(Number(raw) || 0));
    if (amount !== Number(cur.amount)) put("budget", id, { ...cur, amount });
  }
  function editBudget(id) {
    const cur = id ? state.budget[id] : { cat: "other", amount: 0 };
    const vals = { ...cur, label: cur.label || CATS[catOf(cur)].label, cat: catOf(cur), estimate: cur.status === "Estimate" };
    openSheet(id ? "Edit budget item" : "Add a budget item", [
      { k: "label", label: "What is it?", full: true, placeholder: "Universal tickets" },
      { k: "amount", label: "Amount ($)", type: "number" },
      { k: "cat", label: "Category (sets its color)", type: "select", options: Object.keys(CATS).map((c) => [c, CATS[c].label]) },
      { k: "note", label: "Note", full: true, placeholder: "2-park, 1-day, 5 people" },
      { k: "estimate", label: "This is an estimate", type: "check", full: true },

      delete next.estimate;
      if (v.estimate) next.status = "Estimate"; else delete next.status;

  }

  function dreamsView() {

      ${sections || `<div class="card empty"><h3>Nothing on the list yet</h3><div>Start with the one thing you'd be sad to miss.</div>${canWrite ? `<button class="btn" data-act="add-wish">${I.plus} Add a dream</button>` : ""}</div>`}`;
  }

  // Like the dream list, but meals: grouped by park, plus resort restaurants and meals cooked in the room.
  function foodView() {

          <div><div class="t">${esc(f.text)}${meal && meal[0] ? ` <span class="pill">${meal[1]}</span>` : ""}</div>${sub ? `<div class="muted small">${esc(sub)}</div>` : ""}</div>
          <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="heart ${mine ? "on" : ""}" data-act="heart" data-c="food" data-id="${f.id}" aria-pressed="${mine}" aria-label="Heart" ${canWrite ? "" : "disabled"}>${mine ? I.heart : I.heartO}</button>
          ${canWrite ? `<button class="icon-btn" data-act="edit-food" data-id="${f.id}" aria-label="Edit">${I.pencil}</button>` : ""}</div></div>`;

      ${sections || `<div class="card empty"><h3>No food planned yet</h3><div>Start with the snack you'd be saddest to miss.</div>${canWrite ? `<button class="btn" data-act="add-food">${I.plus} Add food</button>` : ""}</div>`}`;

  // ---------- plan: Day 1, Day 2… from check-in to check-out, each a park (or a rest/travel day) and a schedule ----------
  // Days are saved by number (days/d1, d2…), so a plan stays put if the dates move.
  const clock = (t) => { if (!t) return ""; const [h, m] = t.split(":").map(Number); return `${(h % 12) || 12}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; };
  // No dates on purpose: she adds days as she goes, since the trip length isn't settled.
  const dayCount = () => Math.max(0, ...Object.keys(state.days).map((k) => Number(k.slice(1))).filter((x) => x > 0));
  function tripDays() {
    return Array.from({ length: dayCount() }, (_, i) => {
      const num = i + 1, doc = state.days["d" + num] || {};
      return { num, id: "d" + num, park: doc.park || "", note: doc.note || "", items: doc.items || [] };
    });
  }
  function planView() {
    const days = tripDays();
    if (!days.length) return `<div class="row between"><h2>Day by day</h2>${art("outpost", 40)}</div>
      <div class="card empty">${art("sorcerer-hat", 56)}<h3>Sketch the trip one day at a time</h3><div>Add Day 1, pick a park or call it a rest day, then add the rides, meals and shows.</div>
      ${canWrite ? `<button class="btn" data-act="add-day">${I.plus} Add Day 1</button>` : ""}</div>`;
    const count = (f) => days.filter(f).length;
    const parkDays = count((d) => d.park && !OFF_DAYS.includes(d.park)), rest = count((d) => d.park === "Rest day"), travel = count((d) => d.park === "Travel day"), open = count((d) => !d.park);
    const strip = days.map((d) => `<button class="${OFF_DAYS.includes(d.park) ? "rest" : ""}" data-act="jump" data-k="${d.id}" aria-label="Day ${d.num}${d.park ? ", " + esc(d.park) : ""}">${art(PARK_ART[d.park] || "sorcerer-hat")}Day ${d.num}</button>`).join("");
    const cards = days.map((d) => {
      const off = OFF_DAYS.includes(d.park);
      const items = [...d.items].sort((a, b) => (a.time || "99") .localeCompare(b.time || "99"));
      const kind = (k) => { const x = KINDS.find((y) => y[0] === k); return x ? `<span class="pill plain kind ${k}">${x[1]}</span>` : ""; };
      return `<section class="card park day ${off ? "rest" : ""}" id="day-${d.num}">
        <div class="head"><button class="who" data-act="edit-day" data-k="${d.id}" ${canWrite ? "" : "disabled"}>${art(PARK_ART[d.park] || "sorcerer-hat", 40)}
          <h3><span class="when">Day ${d.num}</span>${d.park ? esc(d.park) : `<span class="muted">Pick a park</span>`}</h3></button>
          ${canWrite ? `<button class="icon-btn" data-act="edit-day" data-k="${d.id}" aria-label="Edit day ${d.num}">${I.pencil}</button>` : ""}</div>
        ${d.note ? `<div class="muted small">${esc(d.note)}</div>` : ""}
        ${items.length ? `<div class="sched">${items.map((x) => `<div class="slot">
          <span class="tm">${x.time ? clock(x.time) : "Anytime"}</span>
          <div><div class="t">${esc(x.text)}</div>${kind(x.kind)}</div>
          ${canWrite ? `<button class="icon-btn" data-act="edit-slot" data-k="${d.id}" data-id="${x.id}" aria-label="Edit ${esc(x.text)}">${I.pencil}</button>` : "<span></span>"}</div>`).join("")}</div>` : ""}
        ${canWrite ? `<div><button class="btn ghost sm" data-act="add-slot" data-k="${d.id}">${I.plus} ${items.length ? "Add more" : off ? "Add something" : "Add a ride, meal or show"}</button></div>` : ""}</section>`;
    }).join("");
    const tally = [parkDays && `${parkDays} park day${parkDays > 1 ? "s" : ""}`, rest && `${rest} rest day${rest > 1 ? "s" : ""}`, travel && `${travel} travel day${travel > 1 ? "s" : ""}`, open && `${open} to pick`].filter(Boolean).join(" · ");
    return `<div class="row between"><h2>Day by day</h2>${canWrite && days.length > 1 ? `<button class="btn ghost sm" data-act="days-order">${I.updown} Reorder days</button>` : art("outpost", 40)}</div>
      <div class="muted">Tap a day to pick the park or call it a rest day, then add the rides, meals and shows in order.${tally ? ` <b>${tally}.</b>` : ""}</div>
      ${days.length > 3 ? `<div class="daystrip" role="group" aria-label="Jump to a day">${strip}</div>` : ""}${cards}
      ${canWrite ? `<div><button class="btn" data-act="add-day">${I.plus} Add Day ${days.length + 1}</button></div>` : ""}`;
  }
  // A new day is only saved when she taps Save, so Cancel leaves nothing behind.
  function editDay(id) {
    const isNew = !state.days[id], cur = state.days[id] || { park: "", note: "", items: [] };
    openSheet(isNew ? `Add Day ${id.slice(1)}` : `Day ${id.slice(1)}`, [
      { k: "park", label: "Where are we?", type: "select", full: true, options: [["", "Not decided yet"], ...DAY_PARKS] },
      { k: "note", label: "Note", full: true, placeholder: "Early entry, park hopping to EPCOT at 2…" },
    ], cur, (v) => {
      put("days", id, { ...cur, park: v.park, note: v.note, items: [...(cur.items || [])] });
      if (isNew) setTimeout(() => { const c = document.getElementById("day-" + id.slice(1)); if (c) c.scrollIntoView({ behavior: "smooth", block: "start" }); }, 50);
    }, isNew ? null : () => deleteDay(Number(id.slice(1))));
  }
  // Deleting a day moves the later ones up, so there's never a gap (deleting Day 3 makes Day 4 the new Day 3).
  function deleteDay(num) {
    const n = dayCount();
    for (let k = num; k < n; k++) put("days", "d" + k, state.days["d" + (k + 1)] || { park: "", note: "", items: [] });
    remove("days", "d" + n);
  }
  // Reorder days: a compact list in a pop-up (one line per day, however busy it is), dragged by the handle like the Teams menu.
  // Nothing saves until Done; then each day takes its new number.
  let dayDraft = null, drag = null;
  function showDayOrder(draft) {
    dayDraft = draft || tripDays().map((d) => d.id);
    const root = document.getElementById("sheet-root"), keep = root.querySelector(".sheet"), scroll = keep ? keep.scrollTop : 0;
    const rows = dayDraft.map((id, i) => {
      const doc = state.days[id] || {}, n = (doc.items || []).length;
      return `<div class="nav-row day-row" data-id="${id}">${art(PARK_ART[doc.park] || "sorcerer-hat")}
        <div><span class="eyebrow">Day ${i + 1}</span><div>${doc.park ? esc(doc.park) : `<span class="muted">No park yet</span>`}${n ? ` <span class="muted small">· ${n} planned</span>` : ""}</div></div>
        <span class="handle" aria-hidden="true">${I.grip}</span></div>`;
    }).join("");
    root.innerHTML = `<div class="scrim" data-act="close-sheet"><div class="sheet pinned" role="dialog" aria-modal="true" aria-label="Reorder days" style="animation:${keep ? "none" : ""}">
      <div class="sheet-top"><div class="sheet-head"><h2>Reorder days</h2><div class="row" style="gap:8px;flex-wrap:nowrap">
        <button type="button" class="btn ghost sm" data-cancel>Cancel</button><button type="button" class="btn sm" data-act="days-save">Done</button></div></div></div>
      <div class="muted small">Drag a day by its handle. Each day takes the number of the spot it lands in.</div>
      <div class="navlist daylist">${rows}</div></div></div>`;
    const sheet = root.querySelector(".sheet"); sheet.scrollTop = scroll; pinTop(sheet);
    root.querySelector("[data-cancel]").onclick = closeSheet;
  }
  function saveDayOrder() {
    const docs = dayDraft.map((id) => state.days[id] || { park: "", note: "", items: [] });
    docs.forEach((doc, k) => { if (doc !== state.days["d" + (k + 1)]) put("days", "d" + (k + 1), doc); });
    closeSheet();
  }
  function dragStart(e) {
    const handle = e.target.closest(".day-row .handle"); if (!handle) return;
    e.preventDefault();
    const sheet = handle.closest(".sheet"), rows = [...sheet.querySelectorAll(".day-row")], row = handle.closest(".day-row");
    const rects = rows.map((r) => r.getBoundingClientRect()), i = rows.indexOf(row);
    drag = { sheet, rows, i, t: i, step: rects[i].height, mids: rects.map((r) => r.top + sheet.scrollTop + r.height / 2), y0: e.clientY + sheet.scrollTop, y: e.clientY };
    row.classList.add("lifted");
    if (navigator.vibrate) navigator.vibrate(10);
    requestAnimationFrame(dragTick);
  }
  function dragMove(e) { if (drag) drag.y = e.clientY; }
  // Each frame: follow the finger, scroll the list near its edges, and slide the other days out of the way.
  function dragTick() {
    if (!drag) return;
    const box = drag.sheet.getBoundingClientRect(), edge = 60;
    if (drag.y < box.top + edge + 50) drag.sheet.scrollTop -= Math.ceil((box.top + edge + 50 - drag.y) / 6);
    else if (drag.y > box.bottom - edge) drag.sheet.scrollTop += Math.ceil((drag.y - box.bottom + edge) / 6);
    const dy = drag.y + drag.sheet.scrollTop - drag.y0, mid = drag.mids[drag.i] + dy;
    drag.t = drag.mids.filter((m, j) => j !== drag.i && m < mid).length;
    drag.rows.forEach((r, j) => {
      if (j === drag.i) { r.style.transform = `translateY(${dy}px)`; return; }
      const shift = j > drag.i && j <= drag.t ? -drag.step : j < drag.i && j >= drag.t ? drag.step : 0;
      r.style.transform = shift ? `translateY(${shift}px)` : "";
    });
    requestAnimationFrame(dragTick);
  }
  function dragEnd() {
    if (!drag) return;
    const { i, t } = drag; drag = null;
    const d = [...dayDraft], [moved] = d.splice(i, 1); d.splice(t, 0, moved);
    showDayOrder(d);
  }
  document.addEventListener("pointerdown", dragStart);
  document.addEventListener("pointermove", dragMove);
  document.addEventListener("pointerup", dragEnd);
  document.addEventListener("pointercancel", dragEnd);
  function editSlot(dayId, slotId) {
    const day = state.days[dayId] || { park: "", note: "", items: [] }, items = day.items || [];
    const cur = items.find((x) => x.id === slotId) || { kind: OFF_DAYS.includes(day.park) ? "rest" : "ride", time: "" };
    // Suggest the dreams and food for that day's park.
    const dreams = entries("wishes").filter((w) => !day.park || w.park === day.park || (day.park === "Rest day" && w.park === "Resort & food")).map((w) => w.text)
      .concat(entries("food").filter((f) => !day.park || f.place === day.park || f.place === "Resort meal" || f.place === "Room meal").map((f) => f.text));
    openSheet(slotId ? "Edit plan" : `Add to day ${dayId.slice(1)}`, [
      { k: "text", label: "What are we doing?", full: true, list: dreams, placeholder: dreams.length ? "Start typing, or pick a dream…" : "Seven Dwarfs Mine Train" },
      { k: "time", label: "Time (optional)", type: "time" },
      { k: "kind", label: "Kind", type: "select", options: KINDS },
    ], cur, (v) => {
      const next = { ...cur, ...v, id: cur.id || uid() };
      put("days", dayId, { ...day, items: slotId ? items.map((x) => (x.id === slotId ? next : x)) : [...items, next] });
    }, slotId ? () => put("days", dayId, { ...day, items: items.filter((x) => x.id !== slotId) }) : null);
  }

  // ---------- More: the tabs past the first five, plus reordering ----------
  function showMore(draft) {
    const order = navOrder(), root = document.getElementById("sheet-root");
    const head = (title, right) => `<div class="sheet-top"><div class="sheet-head"><h2>${title}</h2><div class="row" style="gap:8px;flex-wrap:nowrap">${right}</div></div></div>`;
    if (!draft) {
      root.innerHTML = `<div class="scrim" data-act="close-sheet"><div class="sheet pinned" role="dialog" aria-modal="true" aria-label="More">
        ${head("More", `<button type="button" class="btn quiet sm" data-act="reorder">Reorder</button><button type="button" class="icon-btn" data-close aria-label="Close">${I.x}</button>`)}
        <div class="moregrid">${order.slice(BAR).map((k) => { const [, label, ic] = tabOf(k);
          return `<button data-act="tab" data-k="${k}" ${view.tab === k ? 'aria-current="page"' : ""}>${art(ic)}<span>${label}</span></button>`; }).join("")}</div></div></div>`;
    } else {
      const row = (k, i) => { const [, label, ic] = tabOf(k);
        return `<div class="nav-row">${art(ic)}<span>${label}</span>${k === "home" ? "<span></span>" : `<div class="moves">

          <button type="button" class="icon-btn" data-act="nav-move" data-k="${k}" data-n="1" aria-label="Move ${label} down" ${i === draft.length - 1 ? "disabled" : ""}>${I.down}</button></div>`}</div>`; };
      root.innerHTML = `<div class="scrim" data-act="close-sheet"><div class="sheet pinned" role="dialog" aria-modal="true" aria-label="Edit navigation" style="animation:none">
        ${head("Edit navigation", `<button type="button" class="btn ghost sm" data-act="more">Cancel</button><button type="button" class="btn sm" data-act="nav-save">Done</button>`)}
        <div class="muted small">The top ${BAR} show in the bar at the bottom; the rest are under More. Saved on this phone.</div>

      navDraft = draft;
    }

    const btn = root.querySelector("[data-close]"); if (btn) btn.onclick = closeSheet;
  }
  let navDraft = null;

  function todoView() {

    all.sort((a, b) => (a.done - b.done) || ((a.d ? a.d.getTime() : 9e15) - (b.d ? b.d.getTime() : 9e15)));

      <section class="card">${all.length ? `<div class="list">${all.map((x) => {
        const r = x.d ? relDays(x.d) : null;
        return `<div class="item ${x.done ? "done" : ""}">
          <button class="check ${x.done ? "on" : ""}" data-act="toggle" data-c="todos" data-id="${x.id}" aria-pressed="${!!x.done}" aria-label="Mark done" ${canWrite ? "" : "disabled"}>${x.done ? I.tick : ""}</button>
          <div><div class="t">${esc(x.text)}</div><div class="muted small">${x.d ? esc(fmt(x.d, { weekday: "short", month: "short", day: "numeric", year: "numeric" })) : "Anytime"}${x.note ? " · " + esc(x.note) : ""}</div></div>
          <div class="row" style="gap:6px;flex-wrap:nowrap">${r && !x.done ? `<span class="pill ${r.cls}">${r.text}</span>` : ""}${canWrite ? `<button class="icon-btn" data-act="edit-todo" data-id="${x.id}" aria-label="Edit">${I.pencil}</button>` : ""}</div></div>`;
      }).join("")}</div>` : `<div class="empty"><h3>No to-dos yet</h3><div>Add booking windows and reminders here.</div></div>`}</section>`;
  }

  // News is fetched by Claude from the sites' RSS feeds and written to the db (the page itself can't reach the internet).
  // ---------- news (a card on Home, the full list in a pop-up) ----------
  const ago = (iso) => { const d = new Date(iso); if (isNaN(d)) return ""; const h = Math.round((Date.now() - d) / 36e5); return h < 1 ? "Just now" : h < 24 ? `${h}h ago` : h < 48 ? "Yesterday" : d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); };
  // What a story has to say to count as being about one of our resorts. Specific on purpose:
  // a plain "Animal Kingdom" is the park, so the Villas only match Kidani, Jambo House or the Lodge.
  const RESORT_WORDS = [
    [/boardwalk/i, /boardwalk/i], [/old key west/i, /old key west/i], [/riviera/i, /riviera resort/i],
    [/animal kingdom villas|kidani|jambo/i, /kidani|jambo house|animal kingdom (lodge|villas)/i], [/bay lake tower/i, /bay lake tower/i],
    [/grand floridian/i, /grand floridian/i], [/polynesian/i, /polynesian/i], [/fort wilderness/i, /fort wilderness/i],

  const escRe = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

  // ---------- sheet (edit forms) ----------

    if (act === "reorder") { showMore(navOrder()); return; }
    if (act === "nav-move") {
      const d = [...navDraft], i = d.indexOf(el.dataset.k), j = i + Number(el.dataset.n);
      if (j < 1 || j >= d.length) return;
      [d[i], d[j]] = [d[j], d[i]]; showMore(d); return;
    }
    if (act === "nav-save") { store.set(LS_KEY + ":nav", JSON.stringify(navDraft)); closeSheet(); render(); return; }
    if (act === "jump") { const c = document.getElementById("day-" + el.dataset.k.slice(1)); if (c) c.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (act === "filter") { view.filter = el.dataset.k; render(); return; }
    if (act === "theme") { setTheme(isDark() ? "light" : "dark"); return; }
    if (act === "auth-back") { view.auth = { step: "email", email: view.auth.email, error: "", busy: false }; render(); return; }
    if (act === "auth-resend") { apiCall("/api/auth/start", "POST", { email: view.auth.email }).then(() => toast("New code sent."), (err) => toast(err.message)); return; }
    if (act === "account") { showAccount(); return; }
    if (act === "friend-copy") { copyFriendCode(); return; }
    if (act === "friend-new") { apiCall("/api/friends/code", "POST").then((a) => { setAccount(a); toast("New friend code made. The old one won't work anymore."); }, (err) => toast(err.message)); return; }
    if (act === "friend-edit") { editFriend(id); return; }
    if (act === "signout") { apiCall("/api/auth/signout", "POST").finally(() => location.reload()); return; }
    if (act === "cmp-toggle") {
      // Up to three at a time; adding a fourth drops the oldest.
      const ids = cmpIds(rankedOptions()), i = ids.indexOf(id);
      setCmpIds(i >= 0 ? ids.filter((x) => x !== id) : [...ids, id].slice(-3)); return;
    }
    if (act === "receipt") { showReceipt(id); return; }
    if (act === "open-trip") { switchTrip(id); toast(`${tripDoc().name} is open.`); return; }
    if (act === "news-tag") { view.newsTag = el.dataset.k; if (el.closest(".sheet")) showNews(); else render(); return; }
    if (act === "news-more") { view.newsTag = "all"; showNews(); return; }
    if (!canWrite) return;
    if (act === "pc-add") {
      const key = el.dataset.key, kind = el.dataset.kind, input = el.parentElement.querySelector("[data-pc-input]"), text = input ? input.value.trim() : "";
      if (!text) { if (input) input.focus(); return; }
      input.value = "";
      const cur = state.proscons[key] || { name: el.dataset.name, pros: [], cons: [] };
      put("proscons", key, { ...cur, [kind]: [...(cur[kind] || []), { id: uid(), text, by: me }] });
      return;
    }
    if (act === "pc-del") {
      const key = el.dataset.key, kind = el.dataset.kind, cur = state.proscons[key]; if (!cur) return;
      put("proscons", key, { ...cur, [kind]: (cur[kind] || []).filter((x) => x.id !== el.dataset.id) });
      return;
    }
    // Tapping the current star again steps it down, so it can go back to zero.
    if (act === "stars") { const cur = state.resorts[id], n = Number(el.dataset.n); put("resorts", id, { ...cur, desire: Number(cur.desire) === n ? n - 1 : n }); return; }
    if (act === "heart") {
      const c = el.dataset.c, cur = state[c][id]; const h = [...(cur.hearts || [])];
      const i = h.indexOf(me); if (i >= 0) h.splice(i, 1); else h.push(me);
      put(c, id, { ...cur, hearts: h });
      if (i < 0) { const b = document.querySelector(`[data-act="heart"][data-id="${id}"]`); if (b) b.classList.add("pop"); }
      return;
    }
    if (act === "toggle") { const c = el.dataset.c, cur = state[c][id]; put(c, id, { ...cur, done: !cur.done }); return; }
    if (act === "pick") { const r = state.resorts[id]; setSettings({ pickId: id, start: r.start || settings().start, end: r.end || settings().end }); toast(`${r.name} is our pick!`); return; }
    if (act === "unpick") { setSettings({ pickId: "" }); return; }
    // Fresh friends first, so someone who just added your code is in the account picker.
    if (act === "edit-trip") return account ? refreshAccount().finally(() => editTrip(id)) : editTrip(id);
    if (act === "add-trip") return account ? refreshAccount().finally(() => editTrip(null)) : editTrip(null);
    if (act === "person-add") { readTrip().rows.push({ name: "", rel: "" }); editTrip(tripDraft.id, true); const ins = document.querySelectorAll('#sheet-root [data-p="name"]'); ins[ins.length - 1].focus(); return; }
    if (act === "person-del") { readTrip().rows.splice(Number(el.dataset.n), 1); editTrip(tripDraft.id, true); return; }
    if (act === "trip-del") {
      if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = "Tap again to delete this trip"; el.style.color = "var(--bad)"; return; }
      deleteTrip(tripDraft.id); closeSheet(); return;
    }
    if (act === "add-resort" || act === "edit-resort") return editResort(id);
    if (act === "add-wish" || act === "edit-wish") return editWish(id);
    if (act === "add-food" || act === "edit-food") return editFood(id);
    if (act === "add-todo" || act === "edit-todo") return editTodo(id);
    if (act === "add-budget" || act === "edit-budget") return editBudget(id);
    if (act === "edit-day") return editDay(el.dataset.k);
    if (act === "add-day") return editDay("d" + (dayCount() + 1));
    if (act === "days-order") return showDayOrder();
    if (act === "days-save") return saveDayOrder();
    if (act === "add-slot" || act === "edit-slot") return editSlot(el.dataset.k, id);
  });
  document.addEventListener("submit", (e) => {
    const form = e.target.dataset && e.target.dataset.form; if (!form) return;
    e.preventDefault();
    if (form.startsWith("auth-")) return authSubmit(form);
    if (form === "trip-save") return saveTrip();
    if (form === "friend-add") apiCall("/api/friends/add", "POST", { code: document.getElementById("friend-code").value })
      .then((res) => { setAccount(res); toast(`You and ${res.friend.name || "your friend"} are friends now!`); }, (err) => toast(err.message));
    if (form === "me-name") apiCall("/api/me", "PUT", { name: document.getElementById("me-name").value.trim() })
      .then((a) => { setAccount(a); showAccount(); toast("Saved."); }, (err) => toast(err.message));
  });
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.id === "sort") { view.sort = el.value; render(); return; }
    if (el.dataset.item && canWrite) { setItemAmount(el.dataset.item, el.value.trim()); return; }
    // Linking a blank Who's going row to a friend fills in their name, and how you know them.
    if (el.dataset.p === "uid" && el.value) {
      const row = (p) => document.querySelector(`#sheet-root [data-p="${p}"][data-i="${el.dataset.i}"]`), name = row("name"), rel = row("rel");
      const f = account.friends.find((x) => x.id === el.value) || {};
      if (name && !name.value.trim()) name.value = el.value === me ? account.user.name : f.name || "";
      if (rel && !rel.value.trim()) rel.value = el.value === me ? "Me" : f.rel || "";
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeSheet();
    if (e.key === "Enter" && e.target.dataset && e.target.dataset.item) { e.preventDefault(); e.target.blur(); }
    // Enter in a pro/con box adds it as a pro; the − Con button is right beside it.
    if (e.key === "Enter" && e.target.dataset && e.target.dataset.pcInput) { e.preventDefault(); const b = e.target.parentElement.querySelector('[data-kind="pros"]'); if (b) b.click(); }
  });
  window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (TABS.some((x) => x[0] === t)) { view.tab = t; render(); } });

  boot();
})();
</script>
