    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M12 13.5l.9 1.9 2 .3-1.5 1.4.4 2-1.8-1-1.8 1 .4-2-1.5-1.4 2-.3z" fill="currentColor"/></svg>',
    sun: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  };
  I.news = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v10a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5M8 17h3"/></svg>';
  // Park illustrations from our own icon set (icons/parks/). Decorative, so alt is empty; the tab label says what it is.
  const art = (name, size) => `<img class="art" src="icons/parks/${name}.svg" alt=""${size ? ` width="${size}" height="${size}"` : ""}>`;
  const TABS = [["home", "Home", art("castle")], ["resorts", "Resorts", art("resort")], ["dates", "Dates", art("globe-plane")], ["budget", "Budget", art("shopping-bag")], ["dreams", "Dreams", art("sorcerer-hat")], ["todo", "To-do", art("bell")], ["news", "News", art("tv-tower")]];
  const PARK_ART = { "Magic Kingdom": "castle", EPCOT: "spaceship-earth", "Hollywood Studios": "tower-of-terror", "Animal Kingdom": "tree-of-life", "Resort & food": "dole-whip", "Anything else": "sorcerer-hat" };

  // ---------- data layer ----------
  const chains = {};
  function put(c, id, data) {
    state[c] = { ...state[c], [id]: data };
    render();
    if (mode !== "shared") return saveLocal();
    const key = c + "/" + id;
    chains[key] = (chains[key] || Promise.resolve()).then(() => db.collection(c).doc(id).set(data)).catch(writeFailed);
  }
  function remove(c, id) {
    const next = { ...state[c] }; delete next[id]; state[c] = next;
    render();
    if (mode !== "shared") return saveLocal();
    const key = c + "/" + id;
    chains[key] = (chains[key] || Promise.resolve()).then(() => db.collection(c).doc(id).delete()).catch(writeFailed);
  }
  function writeFailed(e) {
    if (e && e.code === "invalid_argument" && canWrite !== false) { canWrite = false; render(); toast("You can look but not edit. Ask for Contributor access to make changes."); return; }
    if (e && e.code === "quota_exceeded") return toast("Storage is full. Delete a few old items and try again.");
    toast("That change didn't save. Check your connection and try again.");
  }
  function saveLocal() { store.set(LS_KEY, JSON.stringify(state)); }
  function loadLocal() {
    mode = "local";
    let saved = null; try { saved = JSON.parse(store.get(LS_KEY) || "null"); } catch {}
    const src = saved || JSON.parse(JSON.stringify(STARTER));
    COLLS.forEach((c) => (state[c] = src[c] || {}));
    names = { me: "You" };
    render();
  }

  async function boot() {
    const tab = (location.hash || "").slice(1) || store.get(LS_KEY + ":tab");
    if (TABS.some((t) => t[0] === tab)) view.tab = tab;
    if (!window.claude || !window.claude.use) {
      const site = /^https?:$/.test(location.protocol) ? await siteDb() : null;
      if (!site) return loadLocal();
      db = site; mode = "shared";
      pickMe();
      return subscribe();
    }
    render();
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!d) return loadLocal();
    db = d; userCap = u; mode = "shared";
    if (u) {
      const id = await u.id(); if (id) me = id;
      const w = await u.can("data.write"); if (w === false) canWrite = false;
    }
    subscribe();
  }

  function subscribe() {
    COLLS.forEach((c) => {
      db.collection(c).onSnapshot((snap) => {
        const m = {}; snap.docs.forEach((doc) => (m[doc.id] = doc.data()));
        state[c] = m; render(); resolveNames();
      }, () => toast("Lost the live connection. Reload to reconnect."));
    });
    render();
  }

  // On dtp.ondorilabo.com the Worker keeps the shared plan (worker/index.js); this gives it the same
  // interface as the artifact's db. It checks for changes every 5 seconds while the page is open.
  async function siteDb() {
    let first;
    try { const r = await fetch("/api/docs?since=0", { cache: "no-store" }); if (!r.ok) return null; first = await r.json(); } catch { return null; }
    const cache = {}, subs = {};
    let cursor = 0, polling = false;
    const snap = (c) => ({ docs: Object.entries(cache[c] || {}).map(([id, d]) => ({ id, data: () => d })) });
    const emit = (c) => (subs[c] || []).forEach((cb) => cb(snap(c)));
    const apply = (res) => {
      const touched = new Set();
      res.docs.forEach((d) => { const m = (cache[d.coll] = cache[d.coll] || {}); if (d.deleted) delete m[d.id]; else m[d.id] = d.data; touched.add(d.coll); });
      cursor = Math.max(cursor, res.cursor || 0);
      return touched;
    };
    apply(first);
    async function poll() {
      if (polling) return; polling = true;
      try { const r = await fetch(`/api/docs?since=${cursor}`, { cache: "no-store" }); if (r.ok) apply(await r.json()).forEach(emit); } catch {} finally { polling = false; }
    }
    setInterval(() => { if (document.visibilityState === "visible") poll(); }, 5000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") poll(); });
    async function send(c, id, init, local) {
      const m = (cache[c] = cache[c] || {}); if (local === undefined) delete m[id]; else m[id] = local;
      const r = await fetch(`/api/docs/${encodeURIComponent(c)}/${encodeURIComponent(id)}`, init);
      if (!r.ok) throw Object.assign(new Error("Save failed"), { code: r.status === 413 ? "quota_exceeded" : "unavailable" });
      poll();
    }
    return {
      collection: (c) => ({
        onSnapshot(cb) { (subs[c] = subs[c] || []).push(cb); cb(snap(c)); },
        doc: (id) => ({
          set: (data) => send(c, id, { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(data) }, data),
          delete: () => send(c, id, { method: "DELETE" }),
        }),
      }),
    };
  }

  // The website has no sign-in, so each phone says once who is using it (for hearts and pros & cons).
  const PEOPLE = { dan: "Dan", brittany: "Brittany" };
  function pickMe() {
    const saved = store.get(LS_KEY + ":me");
    names = { ...PEOPLE };
    if (saved && PEOPLE[saved]) { me = saved; names[me] = "You"; return; }
    openSheet("Who's planning on this phone?", [{ k: "who", label: "This is", type: "select", options: Object.entries(PEOPLE), full: true }], { who: "brittany" },
      (v) => { me = v.who; store.set(LS_KEY + ":me", me); names = { ...PEOPLE, [me]: "You" }; render(); });
  }

  async function resolveNames() {
    if (!userCap) return;
    const ids = new Set();
    ["resorts", "wishes"].forEach((c) => entries(c).forEach((r) => (r.hearts || []).forEach((h) => ids.add(h))));
    entries("proscons").forEach((p) => [...(p.pros || []), ...(p.cons || [])].forEach((x) => x.by && ids.add(x.by)));
    ids.add(me);
    const missing = [...ids].filter((i) => !(i in names));
    if (!missing.length) return;
    const ps = await userCap.profiles([...ids]);
    Object.values(ps).forEach((p) => (names[p.id] = p.isMe ? "You" : (p.name || "Someone").split(" ")[0]));
    render();
  }

  // ---------- derived ----------
  function totals() {
    const s = settings();
    const pick = s.pickId && state.resorts[s.pickId] ? { id: s.pickId, ...state.resorts[s.pickId] } : null;
    const stay = pick ? Number(pick.total) || 0 : 0;
    const items = entries("budget");
    const byCat = {};
    let other = 0;
    items.forEach((i) => { const a = Number(i.amount) || 0; byCat[i.cat] = (byCat[i.cat] || 0) + a; other += a; });
    byCat.stay = (byCat.stay || 0) + stay;
    const planned = stay + other;
    return { budget: Number(s.budget) || 0, stay, other, planned, left: (Number(s.budget) || 0) - planned, byCat, pick, items };
  }
  function lovedBy(h) {
    if (!h || !h.length) return "";
    const n = h.map((x) => names[x] || "Someone");
    if (h.length === 2 && mode === "shared") return "You both love this";
    return "Loved by " + n.join(" & ");
  }
  function dueDate(t) {
    const s = parseD(settings().start); if (!s) return null;
    if (t.months != null && t.months !== "") { const d = new Date(s); d.setMonth(d.getMonth() - Number(t.months)); return d; }
    if (t.days != null && t.days !== "") return new Date(s.getTime() - Number(t.days) * DAY);
    if (t.due) return parseD(t.due);
    return null;
  }
  function relDays(d) {
    const n = Math.round((d - today()) / DAY);
    if (n === 0) return { text: "Today!", cls: "bad" };
    if (n < 0) return { text: `${-n} day${n === -1 ? "" : "s"} ago`, cls: "plain" };
    if (n <= 30) return { text: `In ${n} day${n === 1 ? "" : "s"}`, cls: "warn" };
    return { text: `In ${n} days`, cls: "plain" };
  }

  // ---------- DVC points & weather ----------
  const charts = () => ({ ...REF.dvc, ...state.dvc });
  const seasonCal = () => state.ref.seasons2027 || REF.seasons;
  const weather = () => state.ref.weather || REF.weather;
  const md = (d) => isoD(d).slice(5);
  function eachNight(a, b, fn) { const x = parseD(a), y = parseD(b); if (!x || !y) return; for (let d = new Date(x); d < y; d.setDate(d.getDate() + 1)) fn(new Date(d)); }
  function seasonIdx(d) {
    const cal = seasonCal(); if (d.getFullYear() !== cal.year) return -1;
    const m = md(d), i = cal.ranges.findIndex((r) => { const [a, b] = r.split(":"); return m >= a && m <= b; });
    return i < 0 ? -1 : cal.rangeSeason[i];
  }
  // Points for a stay: each night is priced by its season and whether it's a Fri/Sat night.
  function stayPoints(room, a, b) {
    let pts = 0, missing = 0;
    eachNight(a, b, (d) => { const s = seasonIdx(d); if (s < 0) { missing++; return; } const we = d.getDay() === 5 || d.getDay() === 6; pts += Number(room.pts[s * 2 + (we ? 1 : 0)]) || 0; });
    return { pts, missing };
  }
  function nightMix(a, b) {
    let we = 0, all = 0; const seasons = new Set();
    eachNight(a, b, (d) => { all++; if (d.getDay() === 5 || d.getDay() === 6) we++; const s = seasonIdx(d); if (s >= 0) seasons.add(s); });
    return { all, we, wk: all - we, seasons: [...seasons] };
  }
  function weatherFor(a, b) {
    const w = weather(), days = [];
    // Weather covers the days you're there, check-in through check-out.
    const x = parseD(a), y = parseD(b); if (!x || !y || y <= x) return null;
    for (let d = new Date(x); d <= y; d.setDate(d.getDate() + 1)) { const v = w.days[md(d)]; days.push({ d: new Date(d), v }); }
    const known = days.filter((x) => x.v);
    if (!known.length) return { days, known };
    const col = (i) => known.map((x) => x.v[i]);
    const sum = (arr) => arr.reduce((s, v) => s + v, 0);
    return { days, known, hiMin: Math.min(...col(0)), hiMax: Math.max(...col(0)), loMin: Math.min(...col(1)), loMax: Math.max(...col(1)),
      rainAvg: Math.round(sum(col(2)) / known.length), rainDays: sum(col(2)) / 100, pourDays: sum(col(3)) / 100, inches: sum(col(4)) };
  }
  // Pros & cons belong to the resort, not one date option, so every BoardWalk option shares one list.
  const pcKey = (name) => String(name || "").split(",")[0].toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "resort";
  const pcFor = (name) => state.proscons[pcKey(name)] || { pros: [], cons: [] };
  function pcCount(name) { const p = pcFor(name), a = (p.pros || []).length, b = (p.cons || []).length; return a || b ? `<span class="pill plain">+${a} / −${b}</span>` : ""; }
  function prosConsHTML(name) {
    const p = pcFor(name), key = pcKey(name);
    const li = (kind, x) => `<li><span>${esc(x.text)}${x.by && names[x.by] ? ` <span class="muted small">· ${esc(names[x.by])}</span>` : ""}</span>${canWrite ? `<button type="button" class="x" data-act="pc-del" data-key="${esc(key)}" data-kind="${kind}" data-id="${esc(x.id)}" aria-label="Remove">×</button>` : ""}</li>`;
    const col = (kind, title, cls) => { const items = p[kind] || []; return `<div class="pc-col ${cls}"><div class="eyebrow">${title}</div>${items.length ? `<ul>${items.map((x) => li(kind, x)).join("")}</ul>` : `<div class="muted small">None yet</div>`}</div>`; };
    return `<div class="pc">${col("pros", "Pros", "good")}${col("cons", "Cons", "bad")}</div>
      ${canWrite ? `<div class="pc-add"><input type="text" maxlength="140" placeholder="Add a pro or con…" aria-label="Pro or con for ${esc(name)}" data-pc-input="${esc(key)}">
        <button type="button" class="btn sm" data-act="pc-add" data-key="${esc(key)}" data-name="${esc(name)}" data-kind="pros">+ Pro</button>
        <button type="button" class="btn ghost sm" data-act="pc-add" data-key="${esc(key)}" data-name="${esc(name)}" data-kind="cons">− Con</button></div>` : ""}`;
  }

  // Ticket estimate: Disney's lowest per-day price × days, child discount, tax, then a cushion for pricier start dates.
  const ticketRef = () => state.ref.tickets || REF.tickets;
  function ticketEstimate(days, ad, ch) {
    const T = ticketRef(), per = Number(T.fromPerDay[days]); if (!per) return null;
    const adult = per * days, child = adult * T.childRatio;
    const base = (adult * ad + child * ch) * (1 + T.tax);
    return { adult, child, low: base, mid: base * (1 + T.likely), high: base * (1 + T.high) };
  }
  const link = (url, text) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>`;
  function weatherCard(a, b, compact) {
    const r = weatherFor(a, b), w = weather();
    if (!r) return "";
    if (!r.known.length) return `<section class="card stack"><h3>Weather, usually</h3><div class="muted small">No weather history loaded for these dates (we have Aug 1 – Nov 15).</div></section>`;
    const strip = r.days.map(({ d, v }) => v ? `<div class="wxday" title="${esc(fmt(d))}: high ${v[0]}°, low ${v[1]}°, ${v[2]}% chance of rain"><span class="muted">${esc(fmt(d, { weekday: "short" }))}</span><span>${d.getMonth() + 1}/${d.getDate()}</span><b>${v[0]}°</b><span class="muted">${v[1]}°</span><span class="rain" aria-hidden="true"><i style="height:${v[2]}%"></i></span><span class="num">${v[2]}%</span></div>` : "").join("");
    const round1 = (n) => (n < 0.95 ? "under 1" : `about ${Math.round(n)}`);
    return `<section class="card stack">
      <div class="row between"><h3>Weather, usually</h3><span class="pill plain">${esc(w.years)} averages</span></div>
      <div class="big3">
        <div><span class="eyebrow">Highs</span><strong>${r.hiMin === r.hiMax ? r.hiMax : `${r.hiMin}–${r.hiMax}`}°</strong></div>
        <div><span class="eyebrow">Lows</span><strong>${r.loMin === r.loMax ? r.loMax : `${r.loMin}–${r.loMax}`}°</strong></div>
        <div><span class="eyebrow">Rain chance</span><strong>${r.rainAvg}%</strong></div></div>
      <div class="soft small">Over these ${r.known.length} days, expect ${round1(r.rainDays)} rainy day${Math.round(r.rainDays) === 1 ? "" : "s"} and ${round1(r.pourDays)} downpour day${Math.round(r.pourDays) === 1 ? "" : "s"}. Florida rain usually means a short afternoon storm, not a washout.</div>
      ${compact ? "" : `<div class="wxstrip" aria-label="Day by day">${strip}</div>
      <div class="muted small">Rain chance = share of past years with ${esc(w.rainDef)}. Downpour = ${esc(w.downpourDef)}. ${esc(w.note)}</div>`}
      <div class="src">Source: ${link(w.url, w.source)}, ${esc(w.place)}, ${esc(w.years)}. Smoothed: ${esc(w.smoothing)}.</div></section>`;
  }

  // ---------- render ----------
  function render() {
    document.getElementById("tabs").innerHTML = TABS.map(([k, label, ic]) =>
      `<button data-act="tab" data-k="${k}" ${view.tab === k ? 'aria-current="page"' : ""}>${ic}<span>${label}</span></button>`).join("");
    const app = document.getElementById("app");
    const top = `<div class="topbar"><div class="brand"><img class="logo" src="icons/logo.png" alt="" width="51" height="34"><b>Trip Planner</b></div>
      <span class="sync ${mode === "shared" ? "" : "local"}">${mode === "starting" ? "Loading…" : mode === "shared" ? "Shared &amp; saved" : "Saved on this device"}</span></div>`;
    const body = { home: homeView, resorts: resortsView, dates: datesView, budget: budgetView, dreams: dreamsView, todo: todoView, news: newsView }[view.tab]();
    // Keep a half-typed pro/con when a live update re-renders the page.
    const typing = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.pcInput
      ? { key: document.activeElement.dataset.pcInput, value: document.activeElement.value } : null;
    app.innerHTML = top + body;
    if (typing && typing.value) { const el = app.querySelector(`[data-pc-input="${typing.key}"]`); if (el) { el.value = typing.value; el.focus(); } }
  }

  function meterHTML(t) {
    const scale = Math.max(t.budget, t.planned) || 1;
    const segs = Object.keys(CATS).filter((c) => t.byCat[c] > 0).map((c) => `<span style="width:${(t.byCat[c] / scale) * 100}%;background:${CATS[c].color}" title="${esc(CATS[c].label)}"></span>`).join("");
    const limit = t.planned > t.budget ? `<i class="limit" style="left:calc(${(t.budget / scale) * 100}% - 1px)" title="Budget"></i>` : "";
    const legend = Object.keys(CATS).filter((c) => t.byCat[c] > 0).map((c) => `<span><i style="background:${CATS[c].color}"></i>${esc(CATS[c].label)} <b class="num">${money(t.byCat[c])}</b></span>`).join("");
    return `<div class="meter" role="img" aria-label="${money(t.planned)} planned of ${money(t.budget)}">${segs}${limit}</div><div class="legend">${legend}</div>`;
  }
  function leftHTML(t) {
    const cls = t.left >= 0 ? "good" : "bad";
    return `<div class="big3">
      <div><span class="eyebrow">Budget</span><strong>${money(t.budget)}</strong></div>
      <div><span class="eyebrow">Planned</span><strong>${money(t.planned)}</strong></div>
      <div><span class="eyebrow">${t.left >= 0 ? "Left over" : "Over by"}</span><strong style="color:var(--${cls})">${money(Math.abs(t.left))}</strong></div></div>`;
  }

  function homeView() {
    const s = settings(), t = totals();
    const start = parseD(s.start), n = nights(s.start, s.end);
    let count = "";
    if (start) {
      const d = Math.round((start - today()) / DAY);
      const end = parseD(s.end);
      count = d > 0 ? `<strong class="num">${d.toLocaleString()}</strong><span>${d === 1 ? "sleep" : "sleeps"} until Disney</span>`
        : end && today() <= end ? `<strong>We're here!</strong>` : `<strong>See ya real soon</strong>`;
    }
    const pick = t.pick;
    const pickHTML = pick ? `<div class="card stack">
        <div class="row between"><span class="eyebrow">Our pick</span><button class="btn quiet sm" data-act="tab" data-k="resorts">Compare all</button></div>
        <div class="row between"><div><h3>${esc(pick.name)}</h3><div class="muted small">${esc(pick.room)} · ${nights(pick.start, pick.end)} nights</div></div>
        <div class="price"><strong class="num">${money(pick.total)}</strong><span class="muted small">${money(pick.total / (nights(pick.start, pick.end) || 1))}/night</span></div></div>
        ${pick.notes ? `<div class="note quote muted">${esc(pick.notes.split("\n")[0])}</div>` : ""}</div>`
      : `<div class="card insight">${art("resort", 48)}<div class="stack" style="gap:6px"><h3>No resort picked yet</h3>
        <div class="muted small">Compare the options and tap “Make it our pick.” Its price fills in the stay line of the budget.</div>
        <div><button class="btn sm" data-act="tab" data-k="resorts">Compare resorts</button></div></div></div>`;
    const loves = entries("resorts").filter((r) => (r.hearts || []).length && !r.out).sort((a, b) => b.hearts.length - a.hearts.length).slice(0, 3);
    const todos = entries("todos").filter((x) => !x.done).map((x) => ({ ...x, d: dueDate(x) })).filter((x) => x.d && x.d >= today()).sort((a, b) => a.d - b.d).slice(0, 3);
    const wish = entries("wishes");
    const wx = weatherFor(s.start, s.end);
    return `
      <section class="hero">
        <svg class="sparkle" style="right:18%;top:22px" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>
        <svg class="sparkle" style="right:8%;top:70px" width="12" height="12" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>
        ${canWrite ? `<button class="icon-btn edit" data-act="edit-trip" aria-label="Edit trip details">${I.pencil}</button>` : ""}
        <div class="eyebrow">Walt Disney World · ${start ? start.getFullYear() : ""}</div>
        <h1>Our Disney Trip</h1>
        <div class="count">${count}</div>
        <div class="meta"><span class="pill">${esc(span(s.start, s.end))}</span><span class="pill">${n} nights</span><span class="pill">${s.adults} adults · ${s.kids} kids</span>${wx && wx.known.length ? `<span class="pill">${I.sun} Usually ${wx.hiMax}° / ${wx.loMin}°</span>` : ""}</div>
        <div class="perf"></div>
      </section>
      <section class="card stack">
        <div class="row between"><h2>Budget</h2><button class="btn quiet sm" data-act="tab" data-k="budget">Details</button></div>
        ${leftHTML(t)}${meterHTML(t)}
      </section>
      ${pickHTML}
      <section class="card insight">${art("globe-plane", 48)}<div class="row between"><div><b>Earlier or later dates?</b><div class="muted small">See every resort's real points cost and the usual weather for any dates.</div></div><button class="btn sm" data-act="tab" data-k="dates">Compare dates</button></div></section>
      ${weatherCard(s.start, s.end, true)}
      ${loves.length ? `<section class="card stack"><span class="eyebrow">Hearted resorts</span>${loves.map((r) => `<div class="row between"><div><b>${esc(r.name)}</b> <span class="muted small">${esc(span(r.start, r.end))}</span></div><span class="pill">${I.heart.replace("<svg", '<svg width="14" height="14"')} ${r.hearts.length}</span></div>`).join("")}</section>` : ""}
      <section class="card stack">
        <div class="row between"><h2>Coming up</h2><button class="btn quiet sm" data-act="tab" data-k="todo">All to-dos</button></div>
        ${todos.length ? todos.map((x) => { const r = relDays(x.d); return `<div class="row between"><div><b>${esc(x.text)}</b><div class="muted small">${fmt(x.d, { month: "long", day: "numeric", year: "numeric" })}</div></div><span class="pill ${r.cls}">${r.text}</span></div>`; }).join("") : `<div class="muted">Nothing dated coming up.</div>`}
      </section>
      <section class="card row between"><div><span class="eyebrow">Dream list</span><div><b class="num">${wish.filter((w) => w.done).length}</b> of <b class="num">${wish.length}</b> done</div></div><button class="btn ghost sm" data-act="tab" data-k="dreams">${art("sorcerer-hat", 20)} Open</button></section>`;
  }

  function resortsView() {
    const t = totals(), s = settings();
    let list = entries("resorts").filter((r) => !r.out);
    const out = entries("resorts").filter((r) => r.out);
    const f = view.filter;
    if (f === "studio") list = list.filter((r) => r.size === "Studio");
    if (f === "1br") list = list.filter((r) => r.size === "1 Bedroom");
    if (f === "walk") list = list.filter((r) => r.walk);
    if (f === "hearts") list = list.filter((r) => (r.hearts || []).length);
    if (f === "dates") list = list.filter((r) => r.start === s.start && r.end === s.end);
    const per = (r) => (Number(r.total) || 0) / (nights(r.start, r.end) || 1);
    list.sort(view.sort === "night" ? (a, b) => per(a) - per(b) : view.sort === "hearts" ? (a, b) => (b.hearts || []).length - (a.hearts || []).length || a.total - b.total : (a, b) => a.total - b.total);

    const all = entries("resorts").filter((r) => !r.out && r.total > 0);
    const cheapest = (sz) => all.filter((r) => r.size === sz).sort((a, b) => a.total - b.total)[0];
    const st = cheapest("Studio"), br = cheapest("1 Bedroom");
    const insight = st && br ? `<section class="card insight"><div class="ic">${I.spark}</div><div><b>5th-sleeper studios save ${money(br.total - st.total)}</b>
      <div class="muted small">Cheapest studio: ${esc(st.name)}, ${money(st.total)} (${nights(st.start, st.end)} nights). Cheapest 1 bedroom: ${esc(br.name)}, ${money(br.total)} (${nights(br.start, br.end)} nights).</div></div></section>` : "";

    const chip = (k, label) => `<button class="chip" data-act="filter" data-k="${k}" aria-pressed="${view.filter === k}">${label}</button>`;
    const sortSel = `<label class="row small muted" for="sort">Sort <select id="sort" data-act="sort" class="chip" style="padding:4px 10px">
      <option value="price" ${view.sort === "price" ? "selected" : ""}>Total price</option><option value="night" ${view.sort === "night" ? "selected" : ""}>Per night</option><option value="hearts" ${view.sort === "hearts" ? "selected" : ""}>Most loved</option></select></label>`;

    const cards = list.map((r) => {
      const n = nights(r.start, r.end), mine = (r.hearts || []).includes(me), picked = s.pickId === r.id;
      const after = t.budget - t.other - (Number(r.total) || 0);
      const diffDates = r.start !== s.start || r.end !== s.end;
      return `<article class="card resort ${picked ? "picked" : ""}">
        <div class="head"><div>
          ${picked ? `<span class="pill picked-badge">Our pick</span> ` : ""}<h3 style="display:inline">${esc(r.name)}</h3>
          <div class="muted small">${esc(r.room)}${r.vibe ? " · " + esc(r.vibe) : ""}</div></div>
          <div class="price"><strong class="num">${money(r.total)}</strong><span class="muted small num">${money(per(r))}/night</span></div></div>
        ${stayMeter(Number(r.total) || 0, t.budget - t.other)}
        <div class="tags">
          <span class="pill ${diffDates ? "warn" : "plain"}">${esc(span(r.start, r.end))} · ${n} nights</span>
          <span class="pill plain">Sleeps ${esc(r.sleeps)}</span>
          <span class="pill ${r.kitchen === "No kitchen" ? "bad" : "plain"}">${esc(r.kitchen)}</span>
          ${r.walk ? `<span class="pill good">Walk to EPCOT &amp; Hollywood Studios</span>` : ""}
          ${r.eeh ? `<span class="pill">Extended evening hours</span>` : ""}
          ${r.points ? `<span class="pill plain">${esc(r.points)} pts @ $${esc(r.ppp)}</span>` : ""}
          <span class="pill plain">${esc(r.source)}</span>
        </div>
        ${r.notes ? `<div class="note quote">${esc(r.notes)}</div>` : ""}
        ${prosConsHTML(r.name)}
        <div class="soft small">With everything else in the budget, this ${after >= 0 ? `leaves <b style="color:var(--good)">${money(after)}</b> to spare` : `goes <b style="color:var(--bad)">${money(-after)} over</b>`}.</div>
        <div class="row between">
          <div class="row">
            <button class="heart ${mine ? "on" : ""}" data-act="heart" data-c="resorts" data-id="${r.id}" aria-pressed="${mine}" aria-label="Heart ${esc(r.name)}" ${canWrite ? "" : "disabled"}>${mine ? I.heart : I.heartO}<span class="num">${(r.hearts || []).length || ""}</span></button>
            <span class="muted small">${esc(lovedBy(r.hearts))}</span>
          </div>
          ${canWrite ? `<div class="row">
            <button class="icon-btn" data-act="edit-resort" data-id="${r.id}" aria-label="Edit ${esc(r.name)}">${I.pencil}</button>
            ${picked ? `<button class="btn ghost sm" data-act="unpick">Unpick</button>` : `<button class="btn sm" data-act="pick" data-id="${r.id}">Make it our pick</button>`}
          </div>` : ""}
        </div></article>`;
    }).join("");

    const empty = !entries("resorts").length
      ? `<div class="card empty"><h3>No resorts yet</h3><div>Add the first option you're looking at, with its dates and total price.</div>${canWrite ? `<button class="btn" data-act="add-resort">${I.plus} Add a resort</button>` : ""}</div>`
      : !list.length ? `<div class="card empty">Nothing matches this filter.</div>` : "";

    return `<div class="row between"><h2>Resorts</h2>${canWrite ? `<button class="btn sm" data-act="add-resort">${I.plus} Add option</button>` : ""}</div>
      ${insight}
      <div class="toolbar" role="group" aria-label="Filter resorts">${chip("all", "All")}${chip("studio", "5th-sleeper studios")}${chip("1br", "1 bedrooms")}${chip("walk", "Walk to parks")}${chip("hearts", "Hearted")}${chip("dates", "Our dates")}</div>
      <div class="row between"><span class="muted small">${list.length} option${list.length === 1 ? "" : "s"} for ${s.adults + s.kids} people</span>${sortSel}</div>
      ${cards}${empty}
      <div class="src">Prices: our DVC rental quotes. Points checked against the ${link(seasonCal().url, "official 2027 DVC points charts")}. To price other dates, use the ${`<a href="#dates">Dates tab</a>`}.</div>
      ${out.length ? `<details class="card"><summary>Ruled out (${out.length})</summary><div class="stack" style="margin-top:12px">${out.map((r) => `<div class="row between"><div><b>${esc(r.name)}</b><div class="muted small note">${esc(r.notes)}</div></div>${canWrite ? `<button class="icon-btn" data-act="edit-resort" data-id="${r.id}" aria-label="Edit ${esc(r.name)}">${I.pencil}</button>` : ""}</div>`).join("")}</div></details>` : ""}`;
  }

  // Up to three date options, compared side by side. Saved in trip/compare so we both see the same options.
  const OPT = [{ k: "A", color: "var(--accent)" }, { k: "B", color: "var(--c-travel)" }, { k: "C", color: "var(--c-mugs)" }];
  const addDays = (iso, k) => { const d = parseD(iso); if (!d) return ""; d.setDate(d.getDate() + k); return isoD(d); };
  function cmpOpts() {
    const saved = (state.trip.compare && state.trip.compare.opts) || view.cmpOpts;
    if (saved) return OPT.map((_, i) => saved[i] && saved[i].start ? saved[i] : { start: "", end: "" });
    const s = settings();
    return [{ start: s.start, end: s.end }, { start: "2027-09-19", end: "2027-10-01" }, { start: "", end: "" }];
  }
  function setOpt(i, patch) {
    const opts = cmpOpts().map((o, j) => (j === i ? { ...o, ...patch } : o));
    view.cmpOpts = opts;
    if (canWrite) put("trip", "compare", { opts }); else render();
  }

  function datesView() {
    const s = settings(), t = totals(), cal = seasonCal(), parkDays = Number(s.tixDays) || 5;
    const opts = cmpOpts().map((o, i) => ({ ...o, ...OPT[i], i, n: nights(o.start, o.end) }));
    const live = opts.filter((o) => o.start && o.n > 0);
    if (!opts.some((o) => o.i === view.cmpFocus && o.start && o.n > 0)) view.cmpFocus = live.length ? live[0].i : 0;
    const focus = opts[view.cmpFocus];

    const optCard = (o) => {
      if (!o.start) return `<div class="opt empty" style="--opt:${o.color}"><b class="opt-tag">${o.k}</b>${canWrite ? `<button class="btn ghost sm" data-act="opt-add" data-i="${o.i}">${I.plus} Add a ${o.i === 1 ? "second" : "third"} option</button>` : `<span class="muted small">No option ${o.k}</span>`}</div>`;
      const mix = nightMix(o.start, o.end), wx = weatherFor(o.start, o.end), isTrip = o.start === s.start && o.end === s.end;
      const off = o.n + 1 - parkDays;
      return `<div class="opt" style="--opt:${o.color}">
        <div class="row between"><b class="opt-tag">${o.k}</b><span class="small" style="font-weight:800">${esc(span(o.start, o.end))}</span>
          ${o.i > 0 && canWrite ? `<button class="x" data-act="opt-clear" data-i="${o.i}" aria-label="Remove option ${o.k}">×</button>` : `<span></span>`}</div>
        <div class="dates">
          <div class="field"><label for="opt-start-${o.i}">Check-in</label><input id="opt-start-${o.i}" data-opt-start="${o.i}" type="date" value="${esc(o.start)}" min="2027-01-01" max="2027-12-31"></div>
          <div class="field"><label for="opt-nights-${o.i}">Nights</label><input id="opt-nights-${o.i}" data-opt-nights="${o.i}" type="number" inputmode="numeric" min="1" max="30" value="${o.n > 0 ? o.n : ""}"></div>
        </div>
        ${o.n > 0 ? `<div class="small muted">Check-out ${esc(fmt(o.end, { weekday: "short", month: "short", day: "numeric" }))} · ${mix.we} Fri/Sat night${mix.we === 1 ? "" : "s"} · ${parkDays} park + ${Math.max(0, off)} off days</div>
        ${wx && wx.known.length ? `<div class="small">${I.sun} Usually ${wx.hiMin === wx.hiMax ? wx.hiMax : `${wx.hiMin}–${wx.hiMax}`}° / ${wx.loMin}–${wx.loMax}° · ${wx.rainAvg}% rain chance · ~${Math.round(wx.rainDays)} rainy day${Math.round(wx.rainDays) === 1 ? "" : "s"}</div>` : ""}
        ${isTrip ? `<span class="pill good">Our trip dates</span>` : canWrite ? `<div><button class="btn quiet sm" data-act="use-dates" data-i="${o.i}">Make these our trip dates</button></div>` : ""}`
        : `<div class="small" style="color:var(--bad)">Pick a check-in and number of nights.</div>`}
      </div>`;
    };

    const rows = [];
    Object.entries(charts()).forEach(([rid, r]) => (r.rooms || []).forEach((room) => {
      const ppp = Number(r.ppp) || 0;
      const per = live.map((o) => { const p = stayPoints(room, o.start, o.end), total = p.pts * ppp; return { o, pts: p.pts, missing: p.missing, total, left: t.budget - t.other - total }; });
      rows.push({ rid, r, room, ppp, per });
    }));
    const f = view.cmpFilter;
    let list = rows;
    if (f === "five") list = list.filter((x) => x.room.sleeps >= 5);
    if (f === "studio") list = list.filter((x) => x.room.size === "Studio" && x.room.sleeps >= 5);
    if (f === "1br") list = list.filter((x) => x.room.size !== "Studio");
    if (f === "walk") list = list.filter((x) => x.r.walk);
    const sortIdx = Math.max(0, live.findIndex((o) => o.i === view.cmpFocus));
    list.sort((a, b) => ((a.per[sortIdx] || {}).total || 0) - ((b.per[sortIdx] || {}).total || 0));
    const chip = (k, label) => `<button class="chip" data-act="cmp-filter" data-k="${k}" aria-pressed="${f === k}">${label}</button>`;
    const anyMissing = rows.some((x) => x.per.some((p) => p.missing));

    const cards = list.map((x) => {
      const min = Math.min(...x.per.map((p) => p.total));
      const cells = x.per.map((p) => `<div class="optcell" style="--opt:${p.o.color}">
          <div class="row between"><b class="opt-tag sm">${p.o.k}</b>${x.per.length > 1 && p.total === min ? `<span class="pill good">Cheapest</span>` : ""}</div>
          <strong class="num">${money(p.total)}</strong>
          ${stayMeter(p.total, t.budget - t.other, true)}
          <span class="muted small num">${p.pts} pts<span class="nn"> · ${p.o.n} nights</span>${p.missing ? ` (+${p.missing} uncharted)` : ""}</span>
          <span class="small" style="font-weight:800;color:var(--${p.left >= 0 ? "good" : "bad"})">${p.left >= 0 ? `${money(p.left)} under` : `${money(-p.left)} over`}</span>
          ${canWrite ? `<button class="btn quiet sm" data-act="cmp-save" data-rid="${esc(x.rid)}" data-room="${esc(x.room.id)}" data-i="${p.o.i}" aria-label="Add option ${p.o.k} for ${esc(x.r.name)} to Resorts">${I.plus} Add</button>` : ""}
        </div>`).join("");
      return `<article class="card resort cmp">
        <div><h3>${esc(x.r.name)}</h3><div class="muted small">${esc(x.room.label)}${x.r.vibe ? " · " + esc(x.r.vibe) : ""}</div></div>
        <div class="tags">
          <span class="pill ${x.room.sleeps >= 5 ? "plain" : "bad"}">Sleeps ${x.room.sleeps}</span>${pcCount(x.r.name)}
          <span class="pill plain">${esc(x.room.kitchen)}</span>
          ${x.r.walk ? `<span class="pill good">Walk to EPCOT &amp; Hollywood Studios</span>` : ""}
        </div>
        <div class="optgrid" style="--cols:${x.per.length}">${cells}</div>
        <label class="ppp">$<input type="number" inputmode="decimal" step="0.5" min="0" value="${esc(x.ppp)}" data-ppp="${esc(x.rid)}" aria-label="Dollars per point at ${esc(x.r.name)}" ${canWrite ? "" : "disabled"}> per point</label>
      </article>`;
    }).join("");

    const focusChips = live.length > 1 ? `<div class="toolbar" role="group" aria-label="Show details for">${live.map((o) => `<button class="chip" data-act="cmp-focus" data-i="${o.i}" aria-pressed="${o.i === view.cmpFocus}">Option ${o.k}</button>`).join("")}</div>` : "";

    return `<div class="row between"><h2>Compare dates</h2></div>
      <div class="muted">Set up to three date options. Every resort's real points cost shows side by side, with how each fits the ${money(t.budget)} budget once everything else (${money(t.other)}) is in.</div>
      <section class="optrow">${opts.map(optCard).join("")}</section>
      ${live.length ? `${focusChips}${weatherCard(focus.start, focus.end)}` : ""}
      ${live.length ? `<div class="toolbar" role="group" aria-label="Filter rooms">${chip("five", "Sleeps 5")}${chip("studio", "5th-sleeper studios")}${chip("1br", "1 bedrooms &amp; cabins")}${chip("walk", "Walk to parks")}${chip("all", "Every room")}</div>
      <div class="muted small">Sorted by option ${OPT[view.cmpFocus].k}, cheapest first.${live.length > 1 ? " Tap an option above to sort by it." : ""}</div>
      ${anyMissing ? `<div class="soft small">Some nights fall outside 2027. Only the 2027 points charts are out, so those nights aren't counted.</div>` : ""}
      ${cards || `<div class="card empty">Nothing matches this filter.</div>`}` : ""}
      <div class="src">Points: ${link(cal.url, cal.source)}. Each night is priced by its season and whether it's a Friday or Saturday night. Matches all 11 rental quotes we had (e.g. BoardWalk studio Sep 19 – Oct 1 = 126 pts). Chart PDFs: ${Object.values(charts()).map((r) => link(r.url, r.name)).join(", ")}. $ per point is from our rental quotes; tap to change it.</div>`;
  }

  // How much of the money left for a resort (budget minus every other cost) a stay uses.
  // Green up to 80%, orange up to 100%, red once it goes over the budget.
  function stayMeter(total, room, compact) {
    const share = room > 0 ? total / room : Infinity;
    const tone = share <= 0.8 ? "good" : share <= 1 ? "warn" : "bad";
    const bar = `<div class="costbar${compact ? " sm" : ""}" role="img" aria-label="Uses ${isFinite(share) ? Math.round(share * 100) + "%" : "all"} of the money left for the stay"><span style="width:${Math.min(1, isFinite(share) ? share : 1) * 100}%;background:var(--${tone})"></span></div>`;
    if (compact) return bar;
    return `<div class="stay-meter"><div class="row between small"><span class="muted">Share of the ${money(Math.max(0, room))} left for a resort</span><b style="color:var(--${tone})">${isFinite(share) ? Math.round(share * 100) + "%" : "Over"}</b></div>${bar}</div>`;
  }

  function budgetView() {
    const t = totals();
    const groups = Object.keys(CATS).map((c) => {
      const rows = t.items.filter((i) => (i.cat || "other") === c);
      if (c === "stay") {
        const stayRow = t.pick
          ? `<div class="item"><span class="dot" style="background:${CATS.stay.color}"></span><div><div class="t">${esc(t.pick.name)}</div><div class="muted small">${esc(t.pick.room)} · ${nights(t.pick.start, t.pick.end)} nights · from our pick</div></div><div class="amount">${money(t.stay)}</div></div>`
          : `<div class="item"><span class="dot" style="background:${CATS.stay.color}"></span><div><div class="t">No resort picked yet</div><div class="muted small">Pick one on the Resorts tab and it shows up here</div></div><button class="btn ghost sm" data-act="tab" data-k="resorts">Pick</button></div>`;
        return { c, html: stayRow + rows.map(itemRow).join("") };
      }
      return rows.length ? { c, html: rows.map(itemRow).join("") } : null;
    }).filter(Boolean);
    return `<div class="row between"><h2>Budget</h2>${canWrite ? `<button class="btn sm" data-act="add-budget">${I.plus} Add cost</button>` : ""}</div>
      <section class="card stack">${leftHTML(t)}${meterHTML(t)}
        ${t.left < 0 ? `<div class="soft small">Over by <b style="color:var(--bad)">${money(-t.left)}</b>. Earlier dates or a studio instead of a 1 bedroom could close the gap.</div>` : `<div class="soft small">Room for extras: <b style="color:var(--good)">${money(t.left)}</b>.</div>`}
        ${canWrite ? `<div><button class="btn ghost sm" data-act="edit-trip">Change budget</button></div>` : ""}</section>
      ${ticketCard(t)}
      <section class="card"><div class="list">${groups.map((g) => `<div class="eyebrow" style="margin-top:10px">${esc(CATS[g.c].label)}</div>${g.html}`).join("")}</div>
      ${!t.items.length ? `<div class="empty">No other costs yet. Add tickets, travel and food to see the full picture.</div>` : ""}</section>`;
  }
  // Park days vs off days for the trip dates. Check-in and check-out days count as days there.
  function dayPlanHTML(parkDays, start, end) {
    const s = settings(), n = nights(start || s.start, end || s.end); if (n <= 0) return "";
    const there = n + 1, off = there - parkDays;
    if (off < 0) return `<div class="soft small" style="color:var(--bad)">That's more park days than the ${there} days we're there.</div>`;
    const dots = Array.from({ length: there }, (_, i) => `<i style="background:${i < parkDays ? "var(--c-tickets)" : "var(--c-mugs)"}"></i>`).join("");
    return `<div class="soft stack" style="gap:6px">
      <div class="small"><b>${n} nights = ${there} days there:</b> <span style="color:var(--c-tickets);font-weight:800">${parkDays} park days</span> + <span style="color:var(--c-mugs);font-weight:800">${off} off days</span> (counting travel days)</div>
      <div class="daydots" aria-hidden="true">${dots}</div></div>`;
  }
  function ticketCard(t) {
    const s = settings(), T = ticketRef(), days = Number(s.tixDays) || 5, ad = Number(s.tixAdults) || 0, ch = Number(s.tixKids) || 0;
    const e = ticketEstimate(days, ad, ch); if (!e) return "";
    const line = t.items.find((i) => i.cat === "tickets");
    const chip = (d) => `<button class="chip" data-act="tix-days" data-k="${d}" aria-pressed="${d === days}" ${canWrite ? "" : "disabled"}>${d} days</button>`;
    return `<section class="card stack">
      <div class="row between"><h3>Park tickets</h3><span class="pill warn">Estimate</span></div>
      <div class="muted small">How many days do we want in the parks? Tickets only cover park days. Off days at the resort, the pool or shopping cost nothing.</div>
      <div class="toolbar" role="group" aria-label="Park days">${[3, 4, 5, 6, 7, 8, 9, 10].map(chip).join("")}</div>
      ${dayPlanHTML(days)}
      <div class="dates">
        <div class="field"><label for="tix-ad">Adult price (ages 10+)</label><input id="tix-ad" type="number" min="0" inputmode="numeric" value="${ad}" ${canWrite ? "" : "disabled"}></div>
        <div class="field"><label for="tix-ch">Child price (ages 3–9)</label><input id="tix-ch" type="number" min="0" inputmode="numeric" value="${ch}" ${canWrite ? "" : "disabled"}></div>
      </div>
      <div class="big3">
        <div><span class="eyebrow">Lowest</span><strong>${money(e.low)}</strong></div>
        <div><span class="eyebrow">Likely</span><strong style="color:var(--accent-ink)">${money(e.mid)}</strong></div>
        <div><span class="eyebrow">High</span><strong>${money(e.high)}</strong></div></div>
      <div class="soft small">${days}-day ticket, 1 park per day, with tax. About ${money(e.adult * (1 + T.likely) * (1 + T.tax))} per adult-price ticket and ${money(e.child * (1 + T.likely) * (1 + T.tax))} per child ticket. Only Annie (3) gets child pricing; Amelia and Avery are 10+ by the trip.</div>
      ${canWrite && line && Math.round(line.amount) !== Math.round(e.mid) ? `<div><button class="btn sm" data-act="tix-use" data-id="${esc(line.id)}">Use ${money(e.mid)} in the budget</button></div>` : line ? `<div class="muted small">The budget uses the likely amount.</div>` : ""}
      <div class="muted small">${esc(T.how)}</div>
      <div class="src">Source: ${link(T.url, T.source)}, checked ${esc(fmt(T.asOf, { month: "short", day: "numeric", year: "numeric" }))}; ${link(T.url2, T.source2)}. Replace this with Disney's real total once it shows our start date.</div></section>`;
  }
  function itemRow(i) {
    const st = i.status || "Estimate";
    const cls = st === "Paid" ? "good" : st === "Booked" ? "" : "warn";
    return `<div class="item"><span class="dot" style="background:${(CATS[i.cat] || CATS.other).color}"></span>
      <div><div class="t">${esc(i.label)} <span class="pill ${cls}">${esc(st)}</span></div>${i.note ? `<div class="muted small">${esc(i.note)}</div>` : ""}</div>
      <div class="row" style="gap:6px;flex-wrap:nowrap"><span class="amount">${money(Number(i.amount) || 0)}</span>${canWrite ? `<button class="icon-btn" data-act="edit-budget" data-id="${i.id}" aria-label="Edit ${esc(i.label)}">${I.pencil}</button>` : ""}</div></div>`;
  }

  function dreamsView() {
    const all = entries("wishes");
    const parks = [...PARKS, ...new Set(all.map((w) => w.park).filter((p) => p && !PARKS.includes(p)))];
    const sections = parks.map((p) => {
      const rows = all.filter((w) => (w.park || "Anything else") === p).sort((a, b) => (a.done - b.done) || (b.hearts || []).length - (a.hearts || []).length);
      if (!rows.length) return "";
      return `<section class="card park"><h3>${art(PARK_ART[p] || "sorcerer-hat", 32)}${esc(p)}</h3><div class="list">${rows.map((w) => {
        const mine = (w.hearts || []).includes(me);
        return `<div class="item ${w.done ? "done" : ""}">
          <button class="check ${w.done ? "on" : ""}" data-act="toggle" data-c="wishes" data-id="${w.id}" aria-pressed="${!!w.done}" aria-label="Mark done" ${canWrite ? "" : "disabled"}>${w.done ? I.tick : ""}</button>
          <div><div class="t">${esc(w.text)}</div>${(w.hearts || []).length ? `<div class="muted small">${esc(lovedBy(w.hearts))}</div>` : ""}</div>
          <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="heart ${mine ? "on" : ""}" data-act="heart" data-c="wishes" data-id="${w.id}" aria-pressed="${mine}" aria-label="Heart" ${canWrite ? "" : "disabled"}>${mine ? I.heart : I.heartO}</button>
          ${canWrite ? `<button class="icon-btn" data-act="edit-wish" data-id="${w.id}" aria-label="Edit">${I.pencil}</button>` : ""}</div></div>`;
      }).join("")}</div></section>`;
    }).join("");
    return `<div class="row between"><h2>Dream list</h2>${canWrite ? `<button class="btn sm" data-act="add-wish">${I.plus} Add a dream</button>` : ""}</div>
      <div class="muted">Rides, snacks, shows and little moments you don't want to miss. Heart the ones you love; tick them off on the trip.</div>
      ${sections || `<div class="card empty"><h3>Nothing on the list yet</h3><div>Start with the one thing you'd be sad to miss.</div>${canWrite ? `<button class="btn" data-act="add-wish">${I.plus} Add a dream</button>` : ""}</div>`}`;
  }

  function todoView() {
    const all = entries("todos").map((x) => ({ ...x, d: dueDate(x) }));
    all.sort((a, b) => (a.done - b.done) || ((a.d ? a.d.getTime() : 9e15) - (b.d ? b.d.getTime() : 9e15)));
    const done = all.filter((x) => x.done).length;
    return `<div class="row between"><h2>To-do</h2>${canWrite ? `<button class="btn sm" data-act="add-todo">${I.plus} Add</button>` : ""}</div>
      <div class="muted">Dates count back from check-in on ${esc(fmt(settings().start, { month: "long", day: "numeric", year: "numeric" }))}. <b class="num">${done}</b> of <b class="num">${all.length}</b> done.</div>
      <section class="card">${all.length ? `<div class="list">${all.map((x) => {
        const r = x.d ? relDays(x.d) : null;
        return `<div class="item ${x.done ? "done" : ""}">
          <button class="check ${x.done ? "on" : ""}" data-act="toggle" data-c="todos" data-id="${x.id}" aria-pressed="${!!x.done}" aria-label="Mark done" ${canWrite ? "" : "disabled"}>${x.done ? I.tick : ""}</button>
          <div><div class="t">${esc(x.text)}</div><div class="muted small">${x.d ? esc(fmt(x.d, { weekday: "short", month: "short", day: "numeric", year: "numeric" })) : "Anytime"}${x.note ? " · " + esc(x.note) : ""}</div></div>
          <div class="row" style="gap:6px;flex-wrap:nowrap">${r && !x.done ? `<span class="pill ${r.cls}">${r.text}</span>` : ""}${canWrite ? `<button class="icon-btn" data-act="edit-todo" data-id="${x.id}" aria-label="Edit">${I.pencil}</button>` : ""}</div></div>`;
      }).join("")}</div>` : `<div class="empty"><h3>No to-dos yet</h3><div>Add booking windows and reminders here.</div></div>`}</section>`;
  }

  // News is fetched by Claude from the sites' RSS feeds and written to the db (the page itself can't reach the internet).
  function newsView() {
    const meta = state.ref.news || {};
    const all = entries("news").sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const tags = [...new Set(all.flatMap((n) => n.tags || []))];
    const tag = tags.includes(view.newsTag) ? view.newsTag : "all";
    const list = tag === "all" ? all : all.filter((n) => (n.tags || []).includes(tag));
    const ago = (iso) => { const d = new Date(iso); if (isNaN(d)) return ""; const h = Math.round((Date.now() - d) / 36e5); return h < 1 ? "Just now" : h < 24 ? `${h}h ago` : d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); };
    const chip = (k, label) => `<button class="chip" data-act="news-tag" data-k="${esc(k)}" aria-pressed="${tag === k}">${esc(label)}</button>`;
    return `<div class="row between"><h2>Disney World news</h2></div>
      <div class="muted small">Latest Walt Disney World stories${meta.updated ? `, updated ${esc(new Date(meta.updated).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))}` : ""}. Tap a headline to read it on the site.</div>
      ${tags.length ? `<div class="toolbar" role="group" aria-label="Filter news">${chip("all", "All")}${tags.map((x) => chip(x, x)).join("")}</div>` : ""}
      ${list.length ? `<section class="card"><div class="list">${list.map((n) => `<article class="news item" style="grid-template-columns:1fr">
          <div class="row" style="gap:6px"><span class="pill">${esc(n.source)}</span><span class="muted small">${esc(ago(n.date))}</span></div>
          <a class="t" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>
          ${n.summary ? `<div class="muted small">${esc(n.summary)}</div>` : ""}
          ${(n.tags || []).length ? `<div class="tags">${n.tags.map((x) => `<span class="pill plain">${esc(x)}</span>`).join("")}</div>` : ""}
        </article>`).join("")}</div></section>`
        : `<div class="card empty"><h3>No news yet</h3><div>Stories show up here once Claude loads the latest headlines.</div></div>`}
      ${meta.sources ? `<div class="src">Sources (RSS feeds): ${meta.sources.map((x) => link(x.url, x.name)).join(", ")}. Only Walt Disney World stories are kept.</div>` : ""}`;
  }

  // ---------- sheet (edit forms) ----------
  function openSheet(title, fields, values, onSave, onDelete) {
    const root = document.getElementById("sheet-root");
    const fieldHTML = fields.map((f) => {
      const v = values[f.k] ?? "";
      const id = "f-" + f.k;
      if (f.type === "check") return `<div class="field cb ${f.full ? "full" : ""}"><input type="checkbox" id="${id}" ${v ? "checked" : ""}><label for="${id}">${esc(f.label)}</label></div>`;
      let input;
      if (f.type === "select") input = `<select id="${id}">${f.options.map((o) => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(v) === String(val) ? "selected" : ""}>${esc(lab)}</option>`; }).join("")}</select>`;
      else if (f.type === "textarea") input = `<textarea id="${id}">${esc(v)}</textarea>`;
      else input = `<input id="${id}" type="${f.type || "text"}" value="${esc(v)}" ${f.type === "number" ? 'inputmode="decimal" step="any"' : ""} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ""}>`;
      return `<div class="field ${f.full ? "full" : ""}"><label for="${id}">${esc(f.label)}</label>${input}</div>`;
    }).join("");
    root.innerHTML = `<div class="scrim" data-act="close-sheet"><form class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="grab"></div><h2>${esc(title)}</h2><div class="fields">${fieldHTML}</div>
      <div class="row between"><div>${onDelete ? `<button type="button" class="btn quiet" data-del>Delete</button>` : ""}</div>
      <div class="row"><button type="button" class="btn ghost" data-cancel>Cancel</button><button type="submit" class="btn">Save</button></div></div></form></div>`;
    const form = root.querySelector("form");
    let armed = false;
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const out = {};
      fields.forEach((f) => {
        const el = document.getElementById("f-" + f.k);
        out[f.k] = f.type === "check" ? el.checked : f.type === "number" ? (el.value === "" ? (f.nullable ? null : 0) : Number(el.value)) : el.value.trim();
      });
      if (fields[0] && !out[fields[0].k] && fields[0].type !== "check") { document.getElementById("f-" + fields[0].k).focus(); return; }
      onSave(out); closeSheet();
    });
    form.querySelector("[data-cancel]").onclick = closeSheet;
    const del = form.querySelector("[data-del]");
    if (del) del.onclick = () => { if (!armed) { armed = true; del.textContent = "Tap again to delete"; del.style.color = "var(--bad)"; return; } onDelete(); closeSheet(); };
    setTimeout(() => { const first = form.querySelector("input,select,textarea"); if (first && matchMedia("(pointer:fine)").matches) first.focus(); }, 30);
  }
  function closeSheet() { document.getElementById("sheet-root").innerHTML = ""; }

  const RESORT_FIELDS = [
    { k: "name", label: "Resort", full: true },
    { k: "room", label: "Room type", full: true },
    { k: "size", label: "Size", type: "select", options: SIZES },
    { k: "sleeps", label: "Sleeps", type: "number" },
    { k: "kitchen", label: "Kitchen", type: "select", options: KITCHENS },
    { k: "source", label: "Booked through", type: "select", options: SOURCES },
    { k: "start", label: "Check-in", type: "date" },
    { k: "end", label: "Check-out", type: "date" },
    { k: "total", label: "Total price ($)", type: "number" },
    { k: "points", label: "Points", type: "number" },
    { k: "ppp", label: "$ per point", type: "number" },
    { k: "vibe", label: "Vibe", placeholder: "Florida beach, Italy…" },
    { k: "walk", label: "Walk to EPCOT & Hollywood Studios", type: "check", full: true },
    { k: "eeh", label: "Extended evening hours", type: "check", full: true },
    { k: "notes", label: "Notes", type: "textarea", full: true },
    { k: "out", label: "Ruled out", type: "check", full: true },
  ];
  function editResort(id) {
    const s = settings();
    const cur = id ? state.resorts[id] : { size: "Studio", sleeps: 5, kitchen: "Kitchenette", source: "DVC rental", start: s.start, end: s.end, eeh: true, hearts: [] };
    openSheet(id ? "Edit resort" : "Add a resort option", RESORT_FIELDS, cur,
      (v) => put("resorts", id || uid(), { ...cur, ...v, hearts: [...(cur.hearts || [])] }),
      id ? () => { remove("resorts", id); if (s.pickId === id) setSettings({ pickId: "" }); } : null);
  }
  function setSettings(patch) { put("trip", "settings", { ...settings(), ...patch }); }
  function editTrip() {
    openSheet("Trip details", [
      { k: "budget", label: "Total budget ($)", type: "number", full: true },
      { k: "start", label: "Check-in", type: "date" }, { k: "end", label: "Check-out", type: "date" },
      { k: "adults", label: "Adults", type: "number" }, { k: "kids", label: "Kids", type: "number" },
    ], settings(), (v) => setSettings(v));
  }
  function editBudget(id) {
    const cur = id ? state.budget[id] : { cat: "other", status: "Estimate" };
    openSheet(id ? "Edit cost" : "Add a cost", [
      { k: "label", label: "What is it?", full: true },
      { k: "amount", label: "Amount ($)", type: "number" },
      { k: "cat", label: "Category", type: "select", options: Object.keys(CATS).map((c) => [c, CATS[c].label]) },
      { k: "status", label: "Status", type: "select", options: ["Estimate", "Booked", "Paid"] },
      { k: "note", label: "Note", full: true },
    ], cur, (v) => put("budget", id || uid(), { ...cur, ...v }), id ? () => remove("budget", id) : null);
  }
  function editWish(id) {
    const cur = id ? state.wishes[id] : { park: PARKS[0], hearts: [me], done: false };
    openSheet(id ? "Edit dream" : "Add a dream", [
      { k: "text", label: "What do you want to do?", full: true },
      { k: "park", label: "Where", type: "select", options: PARKS, full: true },
    ], cur, (v) => put("wishes", id || uid(), { ...cur, ...v, hearts: [...(cur.hearts || [])] }), id ? () => remove("wishes", id) : null);
  }
  function editTodo(id) {
    const cur = id ? state.todos[id] : { done: false, months: null, days: null };
    const timing = cur.months != null && cur.months !== "" ? "months" : cur.days != null && cur.days !== "" ? "days" : cur.due ? "date" : "none";
    const vals = { ...cur, timing, amount: timing === "months" ? cur.months : timing === "days" ? cur.days : "", due: cur.due || "" };
    openSheet(id ? "Edit to-do" : "Add a to-do", [
      { k: "text", label: "To-do", full: true },
      { k: "timing", label: "When", type: "select", options: [["none", "Anytime"], ["months", "Months before check-in"], ["days", "Days before check-in"], ["date", "On a specific date"]] },
      { k: "amount", label: "How many months / days", type: "number", nullable: true },
      { k: "due", label: "Specific date", type: "date", full: true },
      { k: "note", label: "Note", full: true },
    ], vals, (v) => {
      const next = { text: v.text, note: v.note, done: !!cur.done, months: null, days: null, due: "" };
      if (v.timing === "months") next.months = v.amount ?? 0;
      if (v.timing === "days") next.days = v.amount ?? 0;
      if (v.timing === "date") next.due = v.due;
      put("todos", id || uid(), next);
    }, id ? () => remove("todos", id) : null);
  }

  let toastTimer;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 3200);
  }

  // ---------- events ----------
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if (act === "close-sheet") { if (e.target === el) closeSheet(); return; }
    if (act === "sort") return;
    if (act === "tab") { view.tab = el.dataset.k; store.set(LS_KEY + ":tab", view.tab); render(); window.scrollTo({ top: 0 }); return; }
    if (act === "filter") { view.filter = el.dataset.k; render(); return; }
    if (act === "cmp-filter") { view.cmpFilter = el.dataset.k; render(); return; }
    if (act === "cmp-focus") { view.cmpFocus = Number(el.dataset.i); render(); return; }
    if (act === "news-tag") { view.newsTag = el.dataset.k; render(); return; }
    if (!canWrite) return;
    if (act === "pc-add") {
      const key = el.dataset.key, kind = el.dataset.kind, input = el.parentElement.querySelector("[data-pc-input]"), text = input ? input.value.trim() : "";
      if (!text) { if (input) input.focus(); return; }
      input.value = "";
      const cur = state.proscons[key] || { name: el.dataset.name, pros: [], cons: [] };
      put("proscons", key, { ...cur, [kind]: [...(cur[kind] || []), { id: uid(), text, by: me }] });
      return;
    }
    if (act === "pc-del") {
      const key = el.dataset.key, kind = el.dataset.kind, cur = state.proscons[key]; if (!cur) return;
      put("proscons", key, { ...cur, [kind]: (cur[kind] || []).filter((x) => x.id !== el.dataset.id) });
      return;
    }
    if (act === "tix-days") { setSettings({ tixDays: Number(el.dataset.k) }); return; }
    if (act === "tix-use") {
      const s = settings(), e = ticketEstimate(Number(s.tixDays), Number(s.tixAdults), Number(s.tixKids)), cur = state.budget[id]; if (!e || !cur) return;
      put("budget", id, { ...cur, amount: Math.round(e.mid), status: "Estimate", note: `${s.tixDays}-day tickets, ${s.tixAdults} adult-price + ${s.tixKids} child, with tax. Formula estimate from Disney's 2027 lowest prices; swap in the real total when we buy.` });
      toast("Ticket estimate added to the budget"); return;
    }
    if (act === "use-dates") { const o = cmpOpts()[Number(el.dataset.i)]; setSettings({ start: o.start, end: o.end }); toast("Trip dates updated!"); return; }
    if (act === "opt-add") {
      const i = Number(el.dataset.i), prev = cmpOpts()[i - 1] || cmpOpts()[0], k = nights(prev.start, prev.end) || 12;
      setOpt(i, { start: prev.start || settings().start, end: addDays(prev.start || settings().start, k) }); return;
    }
    if (act === "opt-clear") { setOpt(Number(el.dataset.i), { start: "", end: "" }); return; }
    if (act === "cmp-save") {
      const r = charts()[el.dataset.rid], room = (r.rooms || []).find((x) => x.id === el.dataset.room); if (!room) return;
      const { start, end } = cmpOpts()[Number(el.dataset.i)], p = stayPoints(room, start, end), ppp = Number(r.ppp) || 0;
      put("resorts", uid(), { name: r.name, room: room.label, size: room.size, sleeps: room.sleeps, kitchen: room.kitchen, start, end, total: p.pts * ppp, points: p.pts, ppp,
        source: "DVC rental", walk: !!r.walk, eeh: true, vibe: r.vibe || "", notes: "Priced from the official 2027 DVC points chart.", hearts: [], out: false });
      toast(`Added ${r.name} to Resorts`); return;
    }
    if (act === "heart") {
      const c = el.dataset.c, cur = state[c][id]; const h = [...(cur.hearts || [])];
      const i = h.indexOf(me); if (i >= 0) h.splice(i, 1); else h.push(me);
      put(c, id, { ...cur, hearts: h });
      if (i < 0) { const b = document.querySelector(`[data-act="heart"][data-id="${id}"]`); if (b) b.classList.add("pop"); }
      return;
    }
    if (act === "toggle") { const c = el.dataset.c, cur = state[c][id]; put(c, id, { ...cur, done: !cur.done }); return; }
    if (act === "pick") { const r = state.resorts[id]; setSettings({ pickId: id, start: r.start || settings().start, end: r.end || settings().end }); toast(`${r.name} is our pick!`); return; }
    if (act === "unpick") { setSettings({ pickId: "" }); return; }
    if (act === "edit-trip") return editTrip();
    if (act === "add-resort" || act === "edit-resort") return editResort(id);
    if (act === "add-budget" || act === "edit-budget") return editBudget(id);
    if (act === "add-wish" || act === "edit-wish") return editWish(id);
    if (act === "add-todo" || act === "edit-todo") return editTodo(id);
  });
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.id === "sort") { view.sort = el.value; render(); return; }
    // Check-in and nights set check-out. Moving check-in keeps the same number of nights.
    if (el.dataset.optStart) { const i = Number(el.dataset.optStart), o = cmpOpts()[i], k = nights(o.start, o.end); if (el.value) setOpt(i, { start: el.value, end: addDays(el.value, k > 0 ? k : 12) }); else render(); return; }
    if (el.dataset.optNights) { const i = Number(el.dataset.optNights), k = Math.round(Number(el.value)); if (k >= 1 && k <= 30) setOpt(i, { end: addDays(cmpOpts()[i].start, k) }); else render(); return; }
    if ((el.id === "tix-ad" || el.id === "tix-ch") && canWrite) {
      const v = Math.max(0, Math.round(Number(el.value) || 0));
      setSettings(el.id === "tix-ad" ? { tixAdults: v } : { tixKids: v }); return;
    }
    if (el.dataset.ppp && canWrite) {
      const rid = el.dataset.ppp, v = Number(el.value);
      if (!(v > 0)) { render(); return; }
      put("dvc", rid, { ...charts()[rid], ppp: v });
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeSheet();
    // Enter in a pro/con box adds it as a pro; the − Con button is right beside it.
    if (e.key === "Enter" && e.target.dataset && e.target.dataset.pcInput) { e.preventDefault(); const b = e.target.parentElement.querySelector('[data-kind="pros"]'); if (b) b.click(); }
  });
  window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (TABS.some((x) => x[0] === t)) { view.tab = t; render(); } });

  boot();
})();
</script>
